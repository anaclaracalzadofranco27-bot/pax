<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000223">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overhead Bin Alpha | CAE & Boarding Simulator - PAX 2026 / Crystal Cabin Awards</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700&family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cad: {
                            bg: '#000223',
                            panel: '#0a1a3a',
                            border: '#2f4a6b',
                            cyan: '#6d90b8',
                            orange: '#9ba9b5',
                            green: '#5b7b9e',
                            red: '#9ba9b5',
                            purple: '#6d90b8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000223;
            color: #d4dce6;
            overflow-x: hidden;
        }
        /* Custom Technical Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #000223;
        }
        ::-webkit-scrollbar-thumb {
            background: #5b7b9e;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d90b8;
        }
        /* Range Sliders Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 5px;
            cursor: pointer;
            background: #5b7b9e;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #6d90b8;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5.5px;
            box-shadow: 0 0 8px rgba(109,144,184, 0.7);
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        /* Fundo único das simulações = plano quadriculado */
        .sim-bg{background-color:#000223;background-image:linear-gradient(to right,rgba(91,123,158,.10) 1px,transparent 1px),linear-gradient(to bottom,rgba(91,123,158,.10) 1px,transparent 1px);background-size:48px 48px}
        #module-ergo .sim-bg{background:#000223}   /* viewport biomecânico: fundo escuro (mesma paleta da simulação integrada) */
        #module-ergo .sim-card > div:first-child{background:#000223;border-color:rgba(91,123,158,.45)}
        #module-ergo .sim-card > div:first-child span, #module-ergo .sim-card > div:first-child div{color:#bababa}
        #module-unified aside, #module-unified .sim-card > div:last-child{background:#000223;border-color:rgba(91,123,158,.45)}
        #module-unified aside .font-mono, #module-unified .sim-card > div:last-child span{color:#bababa}
        #module-unified .sim-bg{background:#000223}   /* simulação integrada: fundo escuro (mesma paleta da exportação P95) */
        .cad-grid-bg {
            background-image: 
                linear-gradient(to right, rgba(91,123,158,0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(91,123,158,0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glow-cyan {
            box-shadow: 0 0 15px -3px rgba(109,144,184, 0.25);
        }
        .glow-green {
            box-shadow: 0 0 15px -3px rgba(91,123,158, 0.25);
        }

        /* ===== Botões e Chips CAD ===== */
        .cad-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:#6d90b8;color:#000223;font:600 12px 'JetBrains Mono',monospace;border:0;cursor:pointer;transition:background .2s}
        .cad-btn:hover{background:#5b7b9e}
        .cad-btn:disabled{opacity:.55;cursor:default}
        .cad-chip{padding:5px 10px;border-radius:999px;border:1px solid #5b7b9e;background:transparent;color:#d4dce6;font:500 11px 'JetBrains Mono',monospace;cursor:pointer;transition:background .25s,color .25s}
        .cad-chip.done{background:rgba(91,123,158,0.14)}
        .cad-chip.on{background:#6d90b8;color:#000223;border-color:#6d90b8}
        .cad-btn:focus-visible,.cad-chip:focus-visible{outline:2px solid #6d90b8;outline-offset:2px}

        /* ===== Resultados Biomecânicos (5 cartões em overlay) ===== */
        #ergo-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
            background:rgba(15,23,42,0);backdrop-filter:blur(0);visibility:hidden;pointer-events:none;
            transition:background .6s ease,backdrop-filter .6s ease,visibility 0s linear .65s}
        #ergo-overlay.cards-on{background:rgba(15,23,42,.42);backdrop-filter:blur(3px);visibility:visible;pointer-events:auto;cursor:pointer;
            transition:background .6s ease,backdrop-filter .6s ease,visibility 0s}
        .ergo-card{opacity:0;transform:scale(.92) translateY(16px);transition:opacity .55s ease,transform .55s ease;box-shadow:0 18px 50px -12px rgba(15,23,42,.55)}
        #ergo-overlay.cards-on .ergo-card{opacity:1;transform:none;transition:opacity .7s ease,transform .9s cubic-bezier(.22,1,.36,1)}
        #ergo-overlay.cards-on .ergo-card:nth-child(1){transition-delay:0s}
        #ergo-overlay.cards-on .ergo-card:nth-child(2){transition-delay:.1s}
        #ergo-overlay.cards-on .ergo-card:nth-child(3){transition-delay:.2s}
        #ergo-overlay.cards-on .ergo-card:nth-child(4){transition-delay:.3s}
        #ergo-overlay.cards-on .ergo-card:nth-child(5){transition-delay:.45s}
        #ergo-overlay.cards-on .ergo-card.ergo-out{opacity:0!important;transition:opacity .5s ease!important}
        #ergo-overlay.flying{background:rgba(15,23,42,0)!important;backdrop-filter:none!important}
        /* ===== Cartões de tempo (1,2,3): a fonte cresce junto com a caixa; informações empilham quando falta largura ===== */
        .gc{container-type:size;min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
        .gc > *{margin-top:0!important}
        .gc .gc-t{display:block;line-height:1.2;font-size:clamp(10.5px,min(6.4cqw,11cqh),20px)}
        .gc .gc-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
        .gc .gc-blk{min-width:0}
        .gc .gc-r{text-align:right}
        .gc .gc-l{line-height:1.2;font-size:clamp(10px,min(7.2cqw,12cqh),17px)}
        .gc .gc-v1{line-height:1.1;font-size:clamp(24px,min(24cqw,36cqh),54px)}
        .gc .gc-v2{line-height:1.1;font-size:clamp(18px,min(17cqw,27cqh),40px)}
        @media (prefers-reduced-motion: reduce){.ergo-card{transition:none!important;transform:none}}
        /* ===== Painel final: 2 tempos + redução do pico de torque ===== */
        .ergo-big{background:rgba(0,2,35,.82)}
        .ergo-big .eb-t{font:700 clamp(13px,1.3vw,18px)/1.2 'JetBrains Mono',monospace;letter-spacing:.04em}
        .ergo-big .eb-v{margin-top:10px;font:800 clamp(44px,5.2vw,84px)/1 'JetBrains Mono',monospace;color:#ffffff}
        .ergo-hero{border:2px solid #22c55e;box-shadow:0 0 40px -6px rgba(34,197,94,.45)}
        .ergo-hero .eh-v{font:800 clamp(64px,8vw,128px)/1 'Montserrat','Inter',sans-serif;color:#22c55e}
        .ergo-hero .eh-t{margin-top:8px;font:800 clamp(14px,1.5vw,22px)/1.25 'JetBrains Mono',monospace;color:#d4dce6;letter-spacing:.04em}
        .ergo-hero .eh-s{margin-top:6px;font:600 clamp(12px,1.1vw,16px)/1.3 'Inter',sans-serif;color:#9ba9b5}
        #ergo-overlay.cards-on{background:rgba(0,2,35,.55)}

        /* ===== Quadro e Moldura da Simulação Completa (Aba 6) ===== */
        .tw-corner{position:absolute;width:22px;height:22px;z-index:4;border:2px solid rgba(91,123,158,0.7);pointer-events:none}
        .tour-frame .c1{top:8px;left:8px;border-right:0;border-bottom:0}.tour-frame .c2{top:8px;right:8px;border-left:0;border-bottom:0}
        .tour-frame .c3{bottom:8px;left:8px;border-right:0;border-top:0}.tour-frame .c4{bottom:8px;right:8px;border-left:0;border-top:0}
        .tour-frame{--cy:91,123,158;position:relative;overflow:hidden;border:1px solid rgba(91,123,158,0.35);border-radius:16px;padding:32px 30px 34px;
            background-color:#000223;background-image:linear-gradient(to right,rgba(91,123,158,0.09) 1px,transparent 1px),linear-gradient(to bottom,rgba(91,123,158,0.09) 1px,transparent 1px),radial-gradient(ellipse at 50% 35%,#0a1a3a 0%,#000223 100%);background-size:48px 48px,48px 48px,100% 100%}
        #tour-stage.tour-frame{display:none}
        #tour-stage.tour-frame.on{display:block}
        #tour-stage .sim-bg{background:none}            /* a malha única do quadro aparece atrás de todas as simulações */
        .tour-frame .sim-card{background:transparent}
        /* Aba 1 (CAD 3D) no roteiro: sem moldura do viewport, sem botões Iniciar/Restart/Open Door e sem a legenda */
        #tour-stage #module-cad3d .sim-card{border:0;border-radius:0;box-shadow:none;background:transparent}
        #tour-stage #module-cad3d .sim-card > div:first-child{border-bottom:0;background:transparent}
        #tour-stage #cad3d-export{display:none}
        #tour-stage #cad3d-startSim,#tour-stage #cad3d-resetSim,#tour-stage #cad3d-toggleDoor{display:none}
        #tour-stage #cad3d-container > .absolute{display:none}

        /* Aba 1 (CAD 3D) no roteiro/vídeo: SOMENTE o bin 3D com as malas + os 2 balões (sem painéis, títulos, botões, Standards ou legendas) */
        #tour-stage #module-cad3d > div:first-child{display:none !important}
        #tour-stage #module-cad3d .sim-card{margin:0 !important;overflow:visible}
        #tour-stage #module-cad3d .sim-card > div:first-child{display:none !important}
        #tour-stage.rec #module-cad3d{position:absolute !important;inset:0 !important;margin:0 !important}
        #tour-stage.rec #module-cad3d .sim-card{height:100%}
        #tour-stage #cad3d-container{container-type:inline-size}
        .cad3d-balloons{display:none;position:absolute;inset:0;pointer-events:none;z-index:3;font-family:'Open Sans','Inter',sans-serif}
        #tour-stage .cad3d-balloons{display:block}
        /* Callouts HUD (estilo CAD): fundo, borda, linha de chamada e texto ficam DENTRO de um único .hud-callout, e só esse pai
           anima a opacidade (entrada e saída), então caixa, linha e texto aparecem e somem juntos */
        .cad3d-balloons .hud-callout{position:absolute;inset:0;animation:hudIn .7s ease .5s both}
        .cad3d-balloons.hud-off .hud-callout{animation:hudOut .35s ease-in both}
        /* Título "OVERHEAD BIN ALPHA" e descrição: caixas HUD sobre a malha, na entrada da cena 3D (logo depois do alerta da cena 1).
           Ficam dentro de .hud-callout como os callouts, então entram e saem (hudIn / hudOut no pai) junto com eles.
           Tamanhos em cqw: relativos à largura do quadro 16:9 (#cad3d-container é container-type:inline-size no roteiro). */
        .cad3d-balloons .hud-callout-hero{animation-delay:.25s}
        .cad3d-balloons .hud-callout-desc{animation-delay:.9s}
        .cad3d-balloons.hud-off .hud-callout-hero,.cad3d-balloons.hud-off .hud-callout-desc{animation-delay:0s}
        .alpha-hero-title-box{position:absolute;top:5%;left:50%;transform:translateX(-50%);z-index:25;pointer-events:none;
            background:rgba(5,12,36,0.88);border:1px solid rgba(0,180,216,0.55);border-top:3px solid #00B4D8;border-radius:6px;padding:10px 28px;
            box-shadow:0 8px 24px rgba(0,0,0,0.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);white-space:nowrap;
            font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(26px,3cqw,48px);line-height:1.15;letter-spacing:0.14em}
        .alpha-hero-title-box .word-overhead{color:#FFFFFF}
        .alpha-hero-title-box .word-binalpha{color:#00B4D8}
        .alpha-hero-desc-box{position:absolute;bottom:5%;right:4%;z-index:25;max-width:560px;text-align:right;pointer-events:none;
            background:rgba(5,12,36,0.88);border:1px solid rgba(0,180,216,0.55);border-right:3px solid #00B4D8;border-radius:6px;padding:14px 22px;
            box-shadow:0 8px 24px rgba(0,0,0,0.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
            font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-weight:500;font-size:clamp(15px,1.3cqw,24px);line-height:1.45;letter-spacing:0.01em;color:#d4dce6}
        .alpha-hero-desc-box strong{font-weight:800;color:#FFFFFF}
        @keyframes hudIn{from{opacity:0;transform:translateY(.8cqw) scale(.97)}to{opacity:1;transform:none}}
        @keyframes hudOut{from{opacity:1}to{opacity:0}}
        .cad3d-balloons .cb-lead{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
        .cad3d-balloons .cb-lead line{stroke:#38bdf8;stroke-linecap:round}
        .cad3d-balloons .cb-lead circle{fill:#38bdf8}
        .cad3d-balloons .cb{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;white-space:nowrap;
            background:rgba(15,23,42,.88);border:1px solid #38bdf8;border-radius:4px;color:#f8fafc;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
        .cad3d-balloons .cb-door{left:69.27%;top:17.5%;width:23.7%;height:17.1%}   /* 17,5%: folga abaixo do título OVERHEAD BIN ALPHA */
        .cad3d-balloons .cb-door b{font-weight:700;font-size:1.6cqw;line-height:1.2;letter-spacing:.06em;color:#f8fafc}
        .cad3d-balloons .cb-door span{font-weight:400;font-size:1.2cqw;line-height:1.3;color:#cbd5e1;margin-top:.4cqw}
        .cad3d-balloons .cb-iata{left:4.35%;top:75.65%;width:18.75%;height:15.28%;font-size:1.1cqw;font-weight:400;color:#cbd5e1}
        .cad3d-balloons .cb-iata p{margin:0;line-height:1.15}
        .cad3d-balloons .cb-iata p + p{margin-top:.8cqw;line-height:1.1;font-size:1.3cqw;font-weight:700;color:#f8fafc;letter-spacing:.04em}
        .cad3d-balloons .cb-iata u{text-decoration:none;color:#f8fafc}
        @keyframes cbIn{from{opacity:0;transform:translateY(.8cqw) scale(.97)}to{opacity:1;transform:none}}
        /* Vista Superior no roteiro: sem cabeçalho, sem controles e sem moldura */
        #tour-stage #top-card{border:0;border-radius:0;box-shadow:none;background:transparent}
        #tour-stage #top-card > div:nth-child(1),#tour-stage #top-card > div:nth-child(2){display:none}
                #tour-stage #module-topview > div:first-child{display:none}   /* roteiro: sem a caixa de título "Top View – Volumetric Advantage" */
        /* Integrated Simulation (2D Section) no roteiro: sem a barra de controles */
        #tour-stage #module-nova > div:first-child{display:none}   /* Bin Top View no roteiro: sem o cartão de título */
        #tour-stage #module-nova .sim-card{border:0;border-radius:0;box-shadow:none;background:transparent}   /* roteiro: sem a moldura retangular em volta dos bins */
        #tour-stage #module-nova .sim-card .grid > div > div:first-child{display:none}   /* roteiro: sem as faixas "ALPHA BIN — TOP VIEW" e "CONVENTIONAL BIN — TOP VIEW" */
        #tour-stage #module-unified .sim-card > div:first-child{display:none}

        /* Aba 4 (Simulação Integrada) no roteiro/vídeo: SÓ a cena (bin + personagens), a escala de estatura e os títulos CONVENTIONAL / ALPHA */
        #tour-stage #module-unified{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;margin:0 !important}
        #tour-stage.rec #module-unified{position:absolute !important;inset:0 !important;width:auto;aspect-ratio:auto}
        #tour-stage #module-unified > div:first-of-type{display:none !important}
        #tour-stage #module-unified .sim-card{position:absolute;inset:0;margin:0 !important;border:0;border-radius:0;box-shadow:none;background:transparent;overflow:visible}
        #tour-stage #module-unified .sim-card > div:nth-child(2){display:block;position:static}
        #tour-stage #module-unified .sim-card > div:last-child{display:none !important}
        #tour-stage #module-unified .sim-bg{position:absolute !important;left:9.27%;top:14.7%;width:70.73%;height:79%;background:none !important}
        #tour-stage #module-unified aside{position:absolute !important;left:79.4%;top:10%;width:240px !important;height:750px !important;transform-origin:0 0;background:transparent !important;border:0 !important}
        /* roteiro/vídeo: a frase "* Approximate values" fica maior e mais abaixo, fora da base da escala */
        #tour-stage #module-unified aside .uni-note{position:absolute;right:12px;top:100%;margin-top:34px;font-size:17px;line-height:1.2;white-space:nowrap}
        /* roteiro/vídeo: fontes maiores na escala de estatura */
        #tour-stage #module-unified aside > div:first-child{font-size:26px !important;line-height:1.2;white-space:nowrap}
        #tour-stage #module-unified #uni-gauge [id^="uni-ml-"]{font-size:19px !important}
        .uni-titles{display:none}
        #tour-stage .uni-titles{display:block;position:absolute;left:0;top:0;width:100%;height:100%;margin:0 !important;pointer-events:none;z-index:2;font-family:'Montserrat','Inter',sans-serif;font-weight:700;animation:cbIn .7s ease .2s both}
        /* Oculta controles interativos remanescentes durante o roteiro */
        #tour-stage #module-cad3d > div:first-child .bg-cad-bg,
        #tour-stage #module-cad3d [data-cad3d-v] { display: none !important; }
        #tour-stage #uni-export, #tour-stage #uni-export-p95{display:none}
        #tour-stage #module-ergo button[onclick^="toggleManikinAnimation"]{display:none}
        /* roteiro (simulação final): sem a caixa de título, sem a barra "BIOMECHANICAL CAD 2D VIEWPORT" e sem a moldura do cartão */
        #tour-stage #module-ergo > div:first-child{display:none}
        #tour-stage #module-ergo .sim-card > div:first-child{display:none}
        #tour-stage #module-ergo .sim-card{border:0;border-radius:0;box-shadow:none;background:transparent}

        /* ===== Aba 1: Boarding Bridge (passageiros caminhando na passarela do Aviao_Fuselagem_PDF_v10) ===== */
        #pax-frame{display:block;width:100%;height:100%;border:0;background:transparent;color-scheme:dark}
        #tour-stage #module-pax > div:first-child{display:none}   /* roteiro: sem a caixa de título */
        #tour-stage #module-pax .sim-card{border:0;border-radius:0;box-shadow:none;background:transparent}
        #tour-stage #module-pax .sim-card > div:first-child{display:none}   /* roteiro: sem a barra do viewport */
        #tour-stage #pax-host{height:auto;aspect-ratio:16/9}
        #tour-stage.rec #module-pax{position:absolute !important;inset:0 !important;margin:0 !important}
        #tour-stage.rec #module-pax .sim-card,#tour-stage.rec #pax-host{height:100%;aspect-ratio:auto}

        /* ===== Aba 6: Full Simulation ===== */
        #module-tour #tour-btn{padding:10px 22px;font:700 12px 'JetBrains Mono',monospace;color:#000223;background:#5b7b9e;border:1px solid #5b7b9e;border-radius:8px;cursor:pointer;transition:background .2s}
        #module-tour #tour-btn:hover{background:#6d90b8}
        #module-tour #tour-rec{padding:10px 22px;font:700 12px 'JetBrains Mono',monospace;color:#9ba9b5;background:transparent;border:1px solid #5b7b9e;border-radius:8px;cursor:pointer;transition:background .2s}
        #module-tour #tour-rec:hover{background:rgba(91,123,158,0.14)}
        #module-tour #tour-rec.on{background:#dc2626;border-color:#dc2626;color:#ffffff}
        #module-tour #tour-snap{padding:10px 22px;font:700 12px 'JetBrains Mono',monospace;color:#9ba9b5;background:transparent;border:1px solid #5b7b9e;border-radius:8px;cursor:pointer;transition:background .2s}
        #module-tour #tour-snap:hover{background:rgba(91,123,158,0.14)}
        #module-tour #tour-snap.on{background:#dc2626;border-color:#dc2626;color:#ffffff}
        #module-tour #tour-snap:disabled,#module-tour #tour-rec:disabled{opacity:.45;cursor:not-allowed}
        #tour-stage.rec{height:var(--rec-h,820px) !important;overflow:hidden}
        #tour-stage #ergo-overlay { position: absolute !important; inset: 0 !important; border-radius: 16px; }
        body.rec-clean { overflow: hidden !important; background-color: #000223 !important; }
        body.rec-clean > header { display: none !important; }
        body.rec-clean > main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; height: 100vh !important; display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; }
        body.rec-clean #module-tour { width: var(--rec-w, 1456px) !important; max-width: var(--rec-w, 1456px) !important; margin: 0 auto !important; }
        body.rec-clean #tour-ctl-bar { display: none !important; }
        /* quadro mestre 16:9 (1920x1080 no vídeo): caixa exatamente 16:9, centrada; o recuo interno é a mesma fração da largura e da altura,
           então a área útil também é 16:9 e nenhuma cena é cortada ou distorcida */
        #tour-stage.rec { width: var(--rec-w, 1456px) !important; height: var(--rec-h, 819px) !important; aspect-ratio: 16 / 9; margin-left: auto !important; margin-right: auto !important; padding: calc(var(--rec-h, 819px) * 0.022) calc(var(--rec-w, 1456px) * 0.022) !important; overflow: hidden !important; box-sizing: border-box !important; }
        #tour-stage.rec #cad3d-container { height: 100% !important; }
        #tour-stage.rec #module-ergo .sm\:h-\[740px\] { height: calc(var(--rec-h, 819px) * 0.956) !important; }   /* área útil do quadro (altura menos o recuo de 2,2% em cima e embaixo) */
        /* gravação: tamanho fixo do quadro, para o vídeo não mudar de resolução */

        /* ====== TEMA ESCURO GLOBAL (paleta das abas Biomecânica e Simulação Integrada) ====== */
        html, body { background-color:#000223; color:#d4dce6; color-scheme:dark; }
        header img[alt="Alpha"] { filter: brightness(0) invert(.82); }
        ::selection { background:#5b7b9e; color:#000223; }
        html body .text-slate-600{color:#9ba9b5 !important}
        html body .text-slate-700{color:#bababa !important}
        html body .text-slate-800{color:#d4dce6 !important}
        html body .text-slate-900{color:#d4dce6 !important}
        html body .text-slate-950{color:#d4dce6 !important}
        html body .hover\:text-slate-900:hover{color:#d4dce6 !important}
        html body .hover\:bg-slate-200:hover{background-color:rgba(91,123,158,.25) !important}
        html body .bg-slate-200{background-color:#0d2040 !important}
        html body .bg-white{background-color:#0a1a3a !important}
        html body .bg-white\/90{background-color:rgba(0,2,35,.9) !important}
        html body .border-slate-300,html body .border-slate-400{border-color:rgba(91,123,158,.45) !important}
        html body .text-white{color:#000223 !important}
        html body .bg-amber-500.text-slate-950,html body .bg-amber-500 .text-slate-950{color:#020617 !important}

        /* ===================================================================================================
           ENCERRAMENTO (Benefits & Feasibility) — Animacao_Unificada_30s.html embutida.
           Os estilos originais usavam html/body e 100vw/100vh: aqui ficam presos ao #closing-root
           (position:absolute; inset:0), sem fundo sólido. O fundo é a malha blueprint do projeto.
           =================================================================================================== */
        #closing-host{position:relative;width:min(100%,calc(85vh*16/9));aspect-ratio:16/9;margin:0 auto;overflow:hidden;border:1px solid rgba(91,123,158,0.35);border-radius:16px;
            background-color:#000223;background-image:linear-gradient(to right,rgba(91,123,158,0.09) 1px,transparent 1px),linear-gradient(to bottom,rgba(91,123,158,0.09) 1px,transparent 1px),radial-gradient(ellipse at 50% 35%,#0a1a3a 0%,#000223 100%);background-size:48px 48px,48px 48px,100% 100%}
        #closing-root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:transparent;color-scheme:dark}
        #module-closing #closing-ctl button{padding:8px 18px;font:700 12px 'JetBrains Mono',monospace;color:#000223;background:#5b7b9e;border:1px solid #5b7b9e;border-radius:8px;cursor:pointer}
        #module-closing #closing-ctl button:hover{background:#6d90b8}
        /* Simulação Geral: o módulo ocupa o quadro 16:9 inteiro; a malha do #tour-stage fica ao fundo */
        #tour-stage #module-closing > div:first-child{display:none !important}
        #tour-stage #module-closing{position:absolute !important;inset:0 !important;margin:0 !important}
        #tour-stage #closing-host{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;background:transparent}

        #closing-root *{box-sizing:border-box}
        #scene-1,#scene-2{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:transparent}
        #scene-1{display:flex;align-items:center;justify-content:center;font-family:Montserrat,"Segoe UI",Arial,sans-serif}
        #scene-1.go{animation:s1-out .4s linear 9.6s both}
        @keyframes s1-out{from{opacity:1;visibility:visible}to{opacity:0;visibility:hidden;pointer-events:none}}
        #scene-2{opacity:0;visibility:hidden;--o:10s}
        #scene-2.go{animation:s2-show .01s linear 10s both,s2-out .4s linear 19.6s forwards}
        @keyframes s2-out{from{opacity:1;visibility:visible}to{opacity:0;visibility:hidden;pointer-events:none}}
        @keyframes s2-show{from{opacity:0;visibility:hidden}to{opacity:1;visibility:visible}}

        /* ===== scene 1 (0–10 s) ===== */
        #scene-1 *{box-sizing:border-box;margin:0}
        #scene-1 #s1-stage{width:1920px;height:1080px;flex:none;position:relative;overflow:hidden;container-type:inline-size}
        #scene-1 #s1-cam{position:absolute;inset:0;transform-origin:50% 50%}
        #scene-1 svg{display:block;width:100%;height:100%;fill-rule:evenodd;clip-rule:evenodd;shape-rendering:geometricPrecision}
        #scene-1 .fil0{fill:#00B4D8}
        #scene-1 .fil7{fill:#050C24}
        #scene-1 .fil3{fill:#00B4D8}
        #scene-1 .fil2{fill:#7C8B9E}
        #scene-1 .fil5{fill:#7C8B9E}
        #scene-1 .fil4{fill:#ffffff}
        #scene-1 .fil6{fill:#ffffff}
        #scene-1 .fil1{fill:#FF6B1A}
        #scene-1 .fil8{fill:#FF6B1A}
        #scene-1 .fil9{fill:url(#s1-id0)}
        #scene-1 .fil11{fill:url(#s1-id1)}
        #scene-1 .fil10{fill:url(#s1-id2)}
        #scene-1 .tx{display:flex;align-items:center;height:100%;font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-weight:500;line-height:1.15;color:#ffffff}
        #scene-1 .tx.big{font-weight:800;line-height:1.1}
        #scene-1 .rv{opacity:0}
        #scene-1 .pop{transform-box:fill-box;transform-origin:center}
        #scene-1 .dr{stroke-dasharray:1 1;stroke-dashoffset:1}
        #scene-1.go #s1-cam{animation:s1-zoom 10s both}
        #scene-1.go .up{animation:s1-up var(--d,.8s) cubic-bezier(.22,1,.36,1) var(--t) both}
        #scene-1.go .pop{animation:s1-pop var(--d,.7s) cubic-bezier(.22,1,.36,1) var(--t) both}
        #scene-1.go .bl{animation:s1-bin .3s cubic-bezier(.22,1,.36,1) var(--t) both}
        #scene-1.go .dr{animation:s1-draw var(--d) cubic-bezier(.65,0,.35,1) var(--t) both}
        #scene-1.go .ccw{animation:s1-spinr 12s linear var(--t) infinite}
        #scene-1.go .cw{animation:s1-spin 12s linear var(--t) infinite}
        @keyframes s1-zoom{0%,45%{transform:scale(1);animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:scale(.88)}}
        @keyframes s1-up{from{opacity:0;transform:translateY(300px)}to{opacity:1;transform:none}}
        @keyframes s1-pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
        @keyframes s1-bin{from{opacity:0;transform:translateX(250px)}to{opacity:1;transform:none}}
        @keyframes s1-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
        @keyframes s1-spin{to{transform:rotate(360deg)}}
        @keyframes s1-spinr{to{transform:rotate(-360deg)}}
        @media (prefers-reduced-motion:reduce){#scene-1.go #s1-cam{animation-duration:.01s}
        #scene-1.go .rv,#scene-1.go .dr{animation-duration:.01s;animation-delay:0s}
        #scene-1.go .spin{animation:none}}

        // -------------------------------------------------------------------------
        // MÓDULO 1: GEOMETRIA CAD 2D (APÊNDICE A)
        // -------------------------------------------------------------------------
        function computeAllGeometries() {
            const R = 137.16;              // 54.00" (Fuselagem E195-E2)
            const x_livre = 25.4;          // 10.00"
            const folga = 0.508;           // 0.20"
            const espessura_porta = 1.5;   // 0.59"
            const espessura_base = 1.5;    // 0.59"

            const bagW = 14 * CM_PER_IN;   // 35.56 cm (14")
            const bagH = 10 * CM_PER_IN;   // 25.40 cm (10")

            const x_porta_fim = x_porta_inicio + espessura_porta;
            const y_centro = R;
            const y_porta_top = x_porta_inicio < R ? Math.sqrt(R*R - x_porta_inicio*x_porta_inicio) : 0;

            const h1 = bagW;
            const x1_esq = x_porta_fim;
            const x1_dir = x1_esq + w1;

            const h2 = bagH + folga;
            const x2_esq = x1_dir;
            const x2_dir = x2_esq + w2 + folga;

            const y_base_fisica_topo = y_base_geom + espessura_base;
            const y_m1_topo_real = y_base_fisica_topo + h1;
            const y_m2_topo_real = y_base_fisica_topo + h2;
            const comp_porta_alpha = y_porta_top - y_base_fisica_topo;
            const soma_total_alpha = comp_porta_alpha + delta_y + espessura_base;

            const w_emb = bagL;
            const h_emb = bagH + folga;
            const x_emb_esq = x_porta_fim;
            const x_emb_dir = x_emb_esq + w_emb;
            const embValid = (x_emb_dir < R - 2);
            const y_emb_top = embValid ? Math.sqrt(R*R - x_emb_dir*x_emb_dir) : 0;
            const y_emb_base_geom = y_emb_top - h_emb;
            const y_emb_base_topo = y_emb_base_geom + espessura_base;
            const y_emb_topo_real = y_emb_base_topo + h_emb;
            const comp_porta_emb = y_porta_top - y_emb_base_topo;
            const soma_total_emb = comp_porta_emb + delta_y + espessura_base;

                R, x_livre, folga, espessura_porta, espessura_base,
                x_porta_inicio, x_porta_fim, y_centro, y_porta_top, delta_y,
                alpha: {

                    y_base_geom: y_emb_base_geom, y_base_topo: y_emb_base_topo,

        // Helper para desenhar linhas de cota técnicas (setas duplas + linhas de chamada)
        function drawDimensionLine(ctx, x1, y1, x2, y2, label, color = '#1e293b', fontSize = 13, labelOffset = {x: 0, y: 0}, ext1 = null, ext2 = null, cleanLabel = false) {

                ctx.moveTo(ext2.x1, ext2.y1);
                ctx.lineTo(ext2.x2, ext2.y2);

                ctx.fill();
            };

            drawArrowHead(x1, y1, angle + Math.PI);

        // no corredor são a origem; k converte pontos do PDF em cm (bin Alpha = 35" de largura = 88,90 cm).
        // =====================================================================

            //   Convencional: largura 35" (88,90 cm). Queda do fundo desde o ápice do corredor: 21" sob o passageiro do CORREDOR (x = 48,5; u = 23,1 cm)

                if (s[0] === 'M') { const a = P(s[1], s[2]); ctx.moveTo(a[0], a[1]); }
                else if (s[0] === 'L') { const a = P(s[1], s[2]); ctx.lineTo(a[0], a[1]); }
                else { const a = P(s[1], s[2]), b = P(s[3], s[4]), c = P(s[5], s[6]); ctx.bezierCurveTo(a[0], a[1], b[0], b[1], c[0], c[1]); }
            });
            ctx.closePath();
            ctx.save();
            // o bin nunca ultrapassa a parede interna da fuselagem
            ctx.beginPath(); ctx.arc(toX(0), toY(cyW), Math.abs(toX(Rw) - toX(0)), 0, Math.PI * 2); ctx.clip();
            ctx.beginPath();
            V[kind].forEach(s => {
                if (s[0] === 'M') { const a = P(s[1], s[2]); ctx.moveTo(a[0], a[1]); }
                else if (s[0] === 'L') { const a = P(s[1], s[2]); ctx.lineTo(a[0], a[1]); }
                else { const a = P(s[1], s[2]), b = P(s[3], s[4]), c = P(s[5], s[6]); ctx.bezierCurveTo(a[0], a[1], b[0], b[1], c[0], c[1]); }
            });
            ctx.closePath();
            ctx.lineJoin = 'round';
            ctx.fillStyle = '#e7dbed';   // cor de preenchimento do PDF
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // Borda inferior do bin vetorizado em |x| (cm a partir do eixo): devolve a cota Y do fundo do bin (usada pelas cotas de folga da cabeça).
        // Devolve null fora da largura do bin (aí vale o modelo antigo).
        const BIN_VEC_POLY = {};
        function vectorBinUnderY(kind, xAbs, xCorredor, yApex, sf) {
            const V = BIN_VEC;
            if (!BIN_VEC_POLY[kind]) {
                const pts = []; let cur = null;
                V[kind].forEach(sg => {
                    const Q = (px, py) => V.map(kind, px, py);   // mesma transformação (nos pontos de controle) usada no desenho
                    if (sg[0] === 'M' || sg[0] === 'L') { cur = Q(sg[1], sg[2]); pts.push(cur); }
                    else {
                        const p0 = cur, p1 = Q(sg[1], sg[2]), p2 = Q(sg[3], sg[4]), p3 = Q(sg[5], sg[6]);
                        for (let i = 1; i <= 60; i++) { const t = i / 60, u = 1 - t; pts.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); }
                        cur = p3;
                    }
                });
                BIN_VEC_POLY[kind] = pts;   // já em cm, idêntico ao contorno desenhado
            }
            const pts = BIN_VEC_POLY[kind], u = (xAbs - xCorredor) / sf;
            let vmax = -Infinity;
            for (let i = 0; i < pts.length; i++) {
                const a = pts[i], b = pts[(i + 1) % pts.length];
                if ((a[0] - u) * (b[0] - u) <= 0 && a[0] !== b[0]) { const v = a[1] + (b[1] - a[1]) * ((u - a[0]) / (b[0] - a[0])); if (v > vmax) vmax = v; }
            }
            return vmax === -Infinity ? null : yApex - vmax * sf;
        }

        // Helper para desenhar Geometria Técnica Fiel do Bin Alpha (35" de largura radial, altura variando de 20" na frente a 25" no fundo)
        function traceBinAlphaProfile(ctx, toX, toY, xCorredor, yFlatFloor, sign = 1, scaleFactor = 1.0, R_fus = 137.16, fusCenterY = 0.0, flatBottom = false) {
            const rad17 = 17.0 * Math.PI / 180.0;
            const cos17 = Math.cos(rad17);
            const sin17 = Math.sin(rad17);

            const W_flat = 25.91 * scaleFactor;
            const L_ramp = 35.67 * scaleFactor;
            const H_door = 40.33 * scaleFactor;
            const H_chan = 25.11 * scaleFactor;
            const W_tot  = 88.90 * scaleFactor;   // 35.0" de largura transversal exata (88,90 cm)

            const x0 = xCorredor * sign;
            const y0 = yFlatFloor;

            const xFlatEnd = (xCorredor + W_flat) * sign;
            const yFlatEnd = y0;

            const xRampEnd = (xCorredor + W_flat + L_ramp * cos17) * sign;
            const yRampEnd = y0 - L_ramp * sin17;

            const xDivTop = (xCorredor + W_flat + L_ramp * cos17 + H_chan * sin17) * sign;
            const yDivTop = yRampEnd + H_chan * cos17;

            const xStep = (xCorredor + W_flat) * sign;
            const yStepBot = yFlatEnd + H_chan / cos17;
            const yStepTop = y0 + H_door - 1.8 * scaleFactor;

            const yTopApex = fusCenterY + Math.sqrt(Math.max(0, R_fus * R_fus - xCorredor * xCorredor));

            const xOuterTip = (xCorredor + W_tot) * sign;
            const yOuterTip = fusCenterY + Math.sqrt(Math.max(0, R_fus * R_fus - (xCorredor + W_tot) * (xCorredor + W_tot)));

            const yLowest = yTopApex - 25.0 * CM_PER_IN * scaleFactor;

            ctx.save();
            ctx.fillStyle = window.BIN_SOLID ? '#cbd5e1' : 'rgba(241, 245, 249, 0.94)';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2.2;
            const PA = (x, y) => [toX(x), toY(y)];
            const ptsA = [PA(x0, y0), PA(xFlatEnd, yFlatEnd), PA(xRampEnd, yRampEnd)];
            let cyBot = (yLowest + yOuterTip) * 0.5;
            {   // calibra a curva inferior para que o ponto mais baixo do bin seja exatamente a cota de 25"
                // (flatBottom: fundo bem mais plano — mergulho de apenas 3,4 cm abaixo do fim da rampa, conforme bin.pdf)
                const yTarget = flatBottom ? Math.min(yRampEnd, yOuterTip) - 3.4 * scaleFactor : yLowest;
                let cy = (yTarget + yOuterTip) * 0.5, minY = 0;
                for (let k = 0; k < 12; k++) {
                    minY = Infinity;
                    for (let t = 0; t <= 1.0001; t += 0.02) { const u = 1 - t; minY = Math.min(minY, u * u * yRampEnd + 2 * u * t * cy + t * t * yOuterTip); }
                    cy += (yTarget - minY) * 1.2;
                }
                cyBot = cy;
                ptsA.push(...quadPts(PA(xRampEnd, yRampEnd), PA((xCorredor + W_tot * 0.90) * sign, cy), PA(xOuterTip, yOuterTip), 24));
            }
            const numArcSteps = 24;
            for (let i = 1; i <= numArcSteps; i++) {
                const xiAbs = (xCorredor + W_tot) - (W_tot * i) / numArcSteps;
                const yi = fusCenterY + Math.sqrt(Math.max(0, R_fus * R_fus - xiAbs * xiAbs));   // colado na parede interna da fuselagem
                ptsA.push(PA(xiAbs * sign, yi));
            }
            if (window.BIN_SOLID) {
                traceVectorBin(ctx, toX, toY, 'alpha', xCorredor, sign, yTopApex, scaleFactor, R_fus, fusCenterY);   // Simulação Integrada: bin vetorizado (bins.pdf)
            } else {
            if (flatBottom) {
                // Bin no estilo do vetor (Sem_título-3.pdf): casca azul-clara; a cavidade da mala fica transparente (preenchimento par-ímpar)
                ctx.fillStyle = '#e8eef3'; ctx.strokeStyle = '#2e3154'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                roundedPoly(ctx, ptsA, 2.4 * Math.abs(toX(1) - toX(0)));
                ctx.moveTo(toX((xCorredor + 1.2 * scaleFactor) * sign), toY(y0 + 1.0 * scaleFactor));
                ctx.lineTo(toX(xFlatEnd), toY(yFlatEnd + 1.0 * scaleFactor));
                ctx.lineTo(toX(xRampEnd), toY(yRampEnd + 1.0 * scaleFactor));
                ctx.lineTo(toX(xDivTop), toY(yDivTop));
                ctx.lineTo(toX(xStep), toY(yStepBot));
                ctx.lineTo(toX(xStep), toY(yStepTop));
                ctx.lineTo(toX((xCorredor + 1.2 * scaleFactor) * sign), toY(yStepTop));
                ctx.closePath();
                ctx.fill('evenodd');
                ctx.stroke();
            } else {
            ctx.beginPath();
            roundedPoly(ctx, ptsA, 2.4 * Math.abs(toX(1) - toX(0)));
            ctx.fill();
            ctx.stroke();
            }
            }

            if (!window.BIN_SOLID) {
            ctx.fillStyle = flatBottom ? 'rgba(255, 255, 255, 0.10)' : (window.BIN_SOLID ? 'rgba(241, 245, 249, 0.94)' : '#ffffff');
            ctx.strokeStyle = flatBottom ? '#2e3154' : '#334155';
            ctx.lineWidth = flatBottom ? 1.3 : 1.8;
            ctx.beginPath();
            ctx.moveTo(toX((xCorredor + 1.2 * scaleFactor) * sign), toY(y0 + 1.0 * scaleFactor));
            ctx.lineTo(toX(xFlatEnd), toY(yFlatEnd + 1.0 * scaleFactor));
            ctx.lineTo(toX(xRampEnd), toY(yRampEnd + 1.0 * scaleFactor));
            ctx.lineTo(toX(xDivTop), toY(yDivTop));
            ctx.lineTo(toX(xStep), toY(yStepBot));
            ctx.lineTo(toX(xStep), toY(yStepTop));
            ctx.lineTo(toX((xCorredor + 1.2 * scaleFactor) * sign), toY(yStepTop));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = flatBottom ? '#d5d8e0' : 'rgba(67, 70, 151, 0.14)';
            ctx.strokeStyle = flatBottom ? '#2e3154' : '#334155';
            ctx.lineWidth = flatBottom ? 1.3 : 1.6;
            ctx.beginPath();
            ctx.moveTo(toX(xRampEnd + 1.2 * scaleFactor * sign), toY(yRampEnd + 0.6 * scaleFactor));
            ctx.quadraticCurveTo(
                toX((xCorredor + W_tot * 0.90) * sign),
                toY(flatBottom ? cyBot : (yLowest + yOuterTip) * 0.5),
                toX(xOuterTip - 1.8 * scaleFactor * sign),
                toY(yOuterTip + 1.2 * scaleFactor)
            );
            ctx.lineTo(toX(xDivTop + 1.2 * scaleFactor * sign), toY(yDivTop - 0.8 * scaleFactor));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            const xTopPocketStart = (xCorredor + 2.0 * scaleFactor) * sign;
            const xTopPocketEnd = (xCorredor + 20.66 * scaleFactor) * sign;
            const yTopPocketBot = yStepTop + 1.8 * scaleFactor;
            const yTopPocketApex = Math.min(yTopApex - 1.0 * scaleFactor, yTopPocketBot + 5.42 * scaleFactor);
            ctx.fillStyle = flatBottom ? '#d5d8e0' : 'rgba(42, 29, 194, 0.12)';
            ctx.beginPath();
            ctx.moveTo(toX(xTopPocketStart), toY(yTopPocketBot));
            ctx.lineTo(toX(xTopPocketEnd), toY(yTopPocketBot));
            ctx.lineTo(toX(xTopPocketStart), toY(yTopPocketApex));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = flatBottom ? '#2e3154' : '#2a1dc2';
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.moveTo(toX((xCorredor + 0.8 * scaleFactor) * sign), toY(y0 + 1.0 * scaleFactor));
            ctx.lineTo(toX((xCorredor + 0.8 * scaleFactor) * sign), toY(yStepTop - 2.5 * scaleFactor));
            ctx.quadraticCurveTo(
                toX((xCorredor + 0.8 * scaleFactor) * sign),
                toY(yStepTop + 0.8 * scaleFactor),
                toX((xCorredor + 4.5 * scaleFactor) * sign),
                toY(yStepTop + 0.8 * scaleFactor)
            );
            ctx.lineTo(toX(xStep), toY(yStepTop + 0.8 * scaleFactor));
            ctx.stroke();
            }
            ctx.restore();

            const m1W = 23.2 * scaleFactor;
            const m1H = 34.8 * scaleFactor;
            const m1Cx = (xCorredor + 1.4 * scaleFactor + m1W * 0.5) * sign;
            const m1Cy = y0 + 1.2 * scaleFactor + m1H * 0.5;

            const m2W = 33.2 * scaleFactor;
            const m2H = 22.8 * scaleFactor;
            const distAlongRamp = (L_ramp * 0.50);
            const distNormalToRamp = 1.2 * scaleFactor + m2H * 0.5;
            const m2Cx = (xCorredor + W_flat + distAlongRamp * cos17 + distNormalToRamp * sin17) * sign;
            const m2Cy = yFlatEnd - distAlongRamp * sin17 + distNormalToRamp * cos17;

            return {
                x0, y0, xFlatEnd, yFlatEnd, xRampEnd, yRampEnd,
                xDivTop, yDivTop, xStep, yStepBot, yStepTop,
                xOuterTip, yOuterTip, yTopApex, yLowest, rad17,
                m1Cx, m1Cy, m1W, m1H,
                m2Cx, m2Cy, m2W, m2H
            };
        }

        // Helper para desenhar Geometria Coerente do Bin Convencional Embraer (35" de largura radial, 22,5" de altura vertical)
        function traceEmbraerBinProfile(ctx, toX, toY, xCorredor, yPsuShelf, sign = -1, R_fus = 137.16, fusCenterY = 0.0, roundedDoor = false) {
            const scaleFactor = R_fus / 137.16;
            const xTopInnerAbs = xCorredor;
            const yTopInner = fusCenterY + Math.sqrt(Math.max(0, R_fus * R_fus - xTopInnerAbs * xTopInnerAbs)) - 1.2 * scaleFactor;

            const W_tot = 88.90 * scaleFactor; // 35.0" de largura transversal exata
            const xOuterPsuAbs = xTopInnerAbs + W_tot;

            const tiltDeg = 16.5;
            const tiltRad = tiltDeg * Math.PI / 180.0;
            const cosT = Math.cos(tiltRad);
            const sinT = Math.sin(tiltRad);

            const xBackBotAbs = 76.0 * scaleFactor;
            const yBackBot = yPsuShelf + 1.8 * scaleFactor;

            const floorLen = 49.0 * scaleFactor;
            const xFrontBotAbs = xBackBotAbs - floorLen * cosT;
            const yFrontBot = yBackBot + floorLen * sinT;

            const cavH = 24.8 * scaleFactor;
            const xBackTopAbs = xBackBotAbs + cavH * sinT;
            const yBackTop = yBackBot + cavH * cosT;
            const xFrontTopAbs = xFrontBotAbs + cavH * sinT;
            const yFrontTop = yFrontBot + cavH * cosT;

            const yLipBot = yPsuShelf + 11.2 * scaleFactor;

            ctx.save();
            ctx.fillStyle = window.BIN_SOLID ? '#cbd5e1' : 'rgba(203, 213, 225, 0.90)';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2.2;
            const PE = (x, y) => [toX(x), toY(y)];
            const ptsE = [PE(xOuterPsuAbs * sign, yPsuShelf), PE((xBackBotAbs - 2.0 * scaleFactor) * sign, yPsuShelf), PE((xTopInnerAbs + 1.2 * scaleFactor) * sign, yLipBot)];
            const wallY = (x) => fusCenterY + Math.sqrt(Math.max(0, R_fus * R_fus - x * x));   // parede interna da fuselagem
            let xArcStart = xTopInnerAbs;
            let doorInfo = null;
            const yTopInnerWall = wallY(xTopInnerAbs);
            if (roundedDoor) {
                xArcStart = xTopInnerAbs + 7.0 * 2.54 * scaleFactor;
                const yDoorTop = wallY(xArcStart);
                doorInfo = {
                    hingeX: xArcStart * sign, hingeY: yDoorTop,
                    ctrlX: (xTopInnerAbs + 0.4 * scaleFactor) * sign, ctrlY: yDoorTop - 3.0 * scaleFactor,
                    endX: (xTopInnerAbs + 1.2 * scaleFactor) * sign, endY: yLipBot
                };
                ptsE.push(...quadPts(PE(doorInfo.endX, doorInfo.endY), PE(doorInfo.ctrlX, doorInfo.ctrlY), PE(doorInfo.hingeX, doorInfo.hingeY)));
            } else {
                ptsE.push(...quadPts(PE((xTopInnerAbs + 1.2 * scaleFactor) * sign, yLipBot),
                    PE((xTopInnerAbs - 1.5 * scaleFactor) * sign, (yLipBot + yTopInnerWall) * 0.5),
                    PE(xTopInnerAbs * sign, yTopInnerWall)));
            }
            const numArc = 24;
            for (let i = 1; i <= numArc; i++) {
                const xiAbs = xArcStart + ((xOuterPsuAbs - xArcStart) * i) / numArc;
                const yi = (i === numArc) ? yPsuShelf : Math.max(yPsuShelf, wallY(xiAbs));
                ptsE.push(PE(xiAbs * sign, yi));
            }
            if (window.BIN_SOLID) {
                traceVectorBin(ctx, toX, toY, 'conv', xCorredor, sign, fusCenterY + Math.sqrt(Math.max(0, R_fus * R_fus - xTopInnerAbs * xTopInnerAbs)), scaleFactor, R_fus, fusCenterY);   // Simulação Integrada: bin vetorizado (bins.pdf)
            } else {
            ctx.beginPath();
            roundedPoly(ctx, ptsE, 2.4 * Math.abs(toX(1) - toX(0)));
            ctx.fill();
            ctx.stroke();
            }

            if (!window.BIN_SOLID) {
            ctx.fillStyle = window.BIN_SOLID ? 'rgba(203, 213, 225, 0.90)' : '#ffffff';
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(toX(xBackBotAbs * sign), toY(yBackBot));
            ctx.lineTo(toX(xFrontBotAbs * sign), toY(yFrontBot));
            ctx.quadraticCurveTo(
                toX((xFrontBotAbs - 3.2 * scaleFactor) * sign),
                toY((yFrontBot + yFrontTop) * 0.5),
                toX(xFrontTopAbs * sign),
                toY(yFrontTop)
            );
            ctx.lineTo(toX(xBackTopAbs * sign), toY(yBackTop));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            }
            ctx.restore();

            const bagW = 33.6 * scaleFactor;
            const bagH = 22.8 * scaleFactor;
            const distAlong = floorLen * 0.50;
            const distNorm = 1.0 * scaleFactor + bagH * 0.5;
            const bagCxAbs = xBackBotAbs - distAlong * cosT + distNorm * sinT;
            const bagCy = yBackBot + distAlong * sinT + distNorm * cosT;

            return {
                xFrontBot: xTopInnerAbs * sign,
                yFrontBot: yLipBot,
                xFrontTop: xTopInnerAbs * sign,
                yFrontTop: yTopInner,
                xOuterPsu: xOuterPsuAbs * sign,
                yPsuShelf,
                doorInfo,
                bagCx: bagCxAbs * sign,
                bagCy,
                bagW,
                bagH,
                bagAngleRad: sign === -1 ? -tiltRad : tiltRad
            };
        }

        // Helper para desenhar Mala Realista estilo Embraer (Imagem 1) e Bin Alpha (Imagens 2/3)
        function drawRealisticSuitcase(ctx, cx, cy, wPx, hPx, angleRad, label1, label2, isAlphaStyle = false, colorOverride = null) {
            if (colorOverride) {
                // Mala em cor sólida personalizada (usada no Viewport CAD 2D da aba 1)
                const hex = colorOverride.replace('#', '');
                const r = parseInt(hex.substr(0, 2), 16), gC = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
                const dark = `rgb(${Math.round(r * 0.6)}, ${Math.round(gC * 0.6)}, ${Math.round(b * 0.6)})`;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angleRad);
                ctx.fillStyle = colorOverride;
                ctx.strokeStyle = dark;
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                ctx.roundRect(-wPx / 2, -hPx / 2, wPx, hPx, 5);
                ctx.fill();
                ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(-wPx / 2 + 3.5, -hPx / 2 + 3.5, Math.max(4, wPx - 7), Math.max(4, hPx - 7));
                ctx.fillStyle = dark;
                ctx.fillRect(-wPx * 0.16, -hPx / 2 - 2.5, wPx * 0.32, 2.5);
                if (!window.ERGO_VIEW) {   // aba biomecânica: sem rótulos nas malas
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 8.5px "JetBrains Mono", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (label1 && label2) {
                        ctx.fillText(label1, 0, -5);
                        ctx.font = '7.5px "JetBrains Mono", monospace';
                        ctx.fillText(label2, 0, 6);
                    } else if (label1) {
                        ctx.fillText(label1, 0, 0);
                    }
                }
                ctx.restore();
                return;
            }
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angleRad);

            // Corpo principal da mala com cantos arredondados
            ctx.fillStyle = isAlphaStyle ? (window.__mkExport ? '#6b6fc4' : 'rgba(67, 70, 151, 0.30)') : '#a1622f';
            ctx.strokeStyle = isAlphaStyle ? '#2a1dc2' : '#451a03';
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.roundRect(-wPx / 2, -hPx / 2, wPx, hPx, 5);
            ctx.fill();
            ctx.stroke();

            // Costura interna / zíper
            ctx.strokeStyle = isAlphaStyle ? 'rgba(42, 29, 194, 0.50)' : '#78350f';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(-wPx / 2 + 3.5, -hPx / 2 + 3.5, Math.max(4, wPx - 7), Math.max(4, hPx - 7));

            // Alça superior discreta
            ctx.fillStyle = isAlphaStyle ? '#2a1dc2' : '#451a03';
            ctx.fillRect(-wPx * 0.16, -hPx / 2 - 2.5, wPx * 0.32, 2.5);

            if (!window.ERGO_VIEW) {   // aba biomecânica: sem rótulos nas malas
                // Rótulos perfeitamente centralizados dentro da mala
                ctx.fillStyle = isAlphaStyle ? '#0f172a' : '#fef3c7';
                ctx.font = 'bold 8.5px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                if (label1 && label2) {
                    ctx.fillText(label1, 0, -5);
                    ctx.font = '7.5px "JetBrains Mono", monospace';
                    ctx.fillText(label2, 0, 6);
                } else if (label1) {
                    ctx.fillText(label1, 0, 0);
                }
            }
            ctx.restore();
        }

        // =========================================================================
        // MANEQUINS (DUMMIES) — estilo manequim articulado liso, com juntas visíveis
        //   'wood'  -> manequim de madeira bege (Imagem 1)
        //   'white' -> manequim branco com faixas cinzas nas juntas (Imagem 2)
        // Para trocar a aparência de todos os manequins, mude apenas DUMMY_STYLE.
        // =========================================================================
        const DUMMY_PALETTES = {
            android: { hi: '#ffffff', light: '#f4f7fa', mid: '#e2e8f0', dark: '#cbd5e1', edge: '#1e293b', seam: '#1e293b', joint: '#94a3b8', jointDark: '#64748b' }
        };
        const dummyPal = () => DUMMY_PALETTES.android;

        // Esfera de articulação estilo manequim técnico (cinza-azulada com contorno escuro e brilho)
        function drawDummyJointBall(ctx, cx, cy, rPx) {
            if (rPx < 0.8) return;
            const P = dummyPal();
            ctx.save();
            const grad = ctx.createRadialGradient(cx - rPx * 0.3, cy - rPx * 0.3, rPx * 0.1, cx, cy, rPx);
            grad.addColorStop(0.0, '#cbd5e1');
            grad.addColorStop(0.55, P.joint);
            grad.addColorStop(1.0, P.jointDark || '#64748b');
            ctx.fillStyle = grad;
            ctx.strokeStyle = P.edge;
            ctx.lineWidth = 1.45;
            ctx.beginPath();
            ctx.arc(cx, cy, rPx, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        // Segmento de membro estilo manequim ergonômico ilustrado (branco-gelo, contorno nítido e sombreamento cel-shaded suave)
        function drawDummyLimbSegment(ctx, x1, y1, x2, y2, r1Px, r2Px, rings = 0) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len < 1) return;
            const P = dummyPal();
            const ux = dx / len, uy = dy / len;
            const nx = -uy, ny = ux;
            let lx = nx, ly = ny;
            if (lx * -0.6 + ly * -0.8 < 0) { lx = -lx; ly = -ly; }

            ctx.save();
            const midX = (x1 + x2) * 0.5, midY = (y1 + y2) * 0.5;
            const rMax = Math.max(r1Px, r2Px, 2);
            const grad = ctx.createLinearGradient(midX + lx * rMax, midY + ly * rMax, midX - lx * rMax, midY - ly * rMax);
            grad.addColorStop(0.00, P.hi);
            grad.addColorStop(0.35, P.light);
            grad.addColorStop(0.75, P.mid);
            grad.addColorStop(1.00, P.dark);

            ctx.fillStyle = grad;
            ctx.strokeStyle = P.edge;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x1 + nx * r1Px, y1 + ny * r1Px);
            ctx.lineTo(x2 + nx * r2Px, y2 + ny * r2Px);
            ctx.arc(x2, y2, r2Px, Math.atan2(ny, nx), Math.atan2(-ny, -nx), true);
            ctx.lineTo(x1 - nx * r1Px, y1 - ny * r1Px);
            ctx.arc(x1, y1, r1Px, Math.atan2(-ny, -nx), Math.atan2(ny, nx), true);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Brilho lateral limpo (cel-shading)
            if (len > 5) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.lineWidth = Math.max(1.0, rMax * 0.22);
                ctx.lineCap = 'round';
                const t0 = 0.20, t1 = 0.80;
                const ra = (r1Px + (r2Px - r1Px) * t0) * 0.52, rb = (r1Px + (r2Px - r1Px) * t1) * 0.52;
                ctx.beginPath();
                ctx.moveTo(x1 + dx * t0 + lx * ra, y1 + dy * t0 + ly * ra);
                ctx.lineTo(x1 + dx * t1 + lx * rb, y1 + dy * t1 + ly * rb);
                ctx.stroke();
            }
            ctx.restore();
        }

            ctx.closePath();

        // FIGURA FRONTAL COMPLETA (sentada -> em pé) estilo manequim técnico ilustrado

        function drawDummyFrontFigure(ctx, toX, toY, scale, o) {
            const __dkPrev = window.__dkRole; window.__dkRole = 'dummy';   // paleta escura da exportação: boneco
            const P = dummyPal();
            const S = o.S, px = o.px;
            const t = Math.min(1, Math.max(0, o.t || 0));
            const ankleY = (o.ankleY !== undefined) ? o.ankleY : 5.5;
            const lerp = (a, b, k) => a + (b - a) * k;
            const K = (o.slim !== undefined) ? o.slim : 0.74;
            const seg = (x1, y1, x2, y2, r1, r2) =>
                drawDummyLimbSegment(ctx, toX(x1), toY(y1), toX(x2), toY(y2), r1 * K * scale, r2 * K * scale, 0);
            const ball = (x, y, r) =>
                drawDummyJointBall(ctx, toX(x), toY(y), r * K * scale);

            // Marcos verticais (cm)
            const headR = S * 0.066;
            const headCY = o.headTopY - headR;
            const shoulderTopY = o.headTopY - S * 0.175;       // base do pescoço
            const pelvisBotY = o.pelvisBotY;
            const hipJY = pelvisBotY + S * 0.062;              // centro da articulação do quadril
            const kneeJY = lerp(hipJY - S * 0.04, ankleY + (hipJY - ankleY) * 0.5, t);

            // Posições laterais (cm, a partir da linha média)
            const hipX = S * 0.060 * K;
            const kneeX = lerp(S * 0.072, S * 0.062, t) * K;
            const ankX = lerp(S * 0.075, S * 0.060, t) * K;
            const shJY = shoulderTopY - S * 0.04;
            const shJX = S * 0.106 * K;
            const elbX = S * 0.122 * K;
            const elbY = shJY - S * 0.186;
            const handX = lerp(S * 0.088, S * 0.126, t) * K;
            const handY = lerp(hipJY + S * 0.040, elbY - S * 0.150, t);

            // Pescoço cilíndrico cinza-azulado articulado (como na referência)
            const drawNeck = () => {
                const nx = toX(px), ny1 = toY(o.headTopY - headR * 2 + S * 0.025), ny2 = toY(shoulderTopY - S * 0.015);
                const nr = S * 0.029 * K * scale;
                ctx.save();
                const gNeck = ctx.createLinearGradient(nx - nr, 0, nx + nr, 0);
                gNeck.addColorStop(0, '#cbd5e1');
                gNeck.addColorStop(0.45, P.joint);
                gNeck.addColorStop(1, P.jointDark || '#64748b');
                ctx.fillStyle = gNeck;
                ctx.strokeStyle = P.edge;
                ctx.lineWidth = 1.45;
                ctx.beginPath();
                ctx.roundRect(nx - nr, ny1, nr * 2, Math.max(4, ny2 - ny1), nr * 0.45);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            };

            const drawTorso = () => drawDummyTorsoFront3D(ctx, toX(px), toY(pelvisBotY), toY(shoulderTopY),
                S * 0.098 * K * scale, S * 0.076 * K * scale, S * 0.095 * K * scale);

            const drawShinsAndFeet = () => [-1, 1].forEach(sd => {
                // Articulação do quadril (visível sob a pelve)
                ball(px + sd * hipX, hipJY, S * 0.038);
                // Canela
                seg(px + sd * kneeX, kneeJY, px + sd * ankX, ankleY, S * 0.036, S * 0.024);
                // Esfera do tornozelo
                ball(px + sd * ankX, ankleY, S * 0.025);
                // Pé escultural de manequim
                seg(px + sd * ankX, ankleY + 0.8, px + sd * (ankX + S * 0.010), S * 0.025, S * 0.026, S * 0.029);
            });

            const drawThighs = () => [-1, 1].forEach(sd => {
                seg(px + sd * hipX, hipJY, px + sd * kneeX, kneeJY, S * 0.048, S * 0.039);
                // Rótula / junta esférica cinza-azulada do joelho
                ball(px + sd * kneeX, kneeJY, S * 0.035);
            });

            const drawUpperArms = () => [-1, 1].forEach(sd => {
                // Esfera de articulação do ombro (destaque igual à referência)
                ball(px + sd * shJX, shJY, S * 0.035);
                seg(px + sd * shJX, shJY, px + sd * elbX, elbY, S * 0.031, S * 0.026);
                // Esfera do cotovelo
                ball(px + sd * elbX, elbY, S * 0.028);
            });

            const drawForearmsAndHands = () => [-1, 1].forEach(sd => {
                seg(px + sd * elbX, elbY, px + sd * handX, handY, S * 0.026, S * 0.020);
                // Punho cinza-azulado + mão tipo luva arredondada
                ball(px + sd * handX, handY, S * 0.020);
                const hl = lerp(S * 0.032, S * 0.068, t);
                seg(px + sd * handX, handY, px + sd * (handX - S * 0.012 * (1 - t)), handY - hl, S * 0.022, S * 0.018);
            });

            drawNeck();
            if (t >= 0.55) { drawShinsAndFeet(); drawThighs(); drawTorso(); }
            else           { drawTorso(); drawShinsAndFeet(); drawThighs(); }
            drawUpperArms();
            drawForearmsAndHands();
            drawDummyHead3D(ctx, toX(px), toY(headCY), headR * 1.04 * scale);
            window.__dkRole = __dkPrev;
        }
