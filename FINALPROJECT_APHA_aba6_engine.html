                        for (let i = 0; i <= N; i++) {
                            const p = pt(outer ? rOut : R, theta(i), outer);
                            i ? ctx.lineTo(...p) : ctx.moveTo(...p);
                        }
                        ctx.stroke();
                    });
                    // Piso coincidente com a Aba 5: 252 cm de vão visual, 8 cm de espessura.
                    ctx.fillStyle = '#cbd5e1';
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = 1.8;
                    const x = toX(-126), w = 252 * scale, y = toY(0), h = 8 * scale;
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeRect(x, y, w, h);
                    ctx.restore();
                }
            };
            const m1 = (W, H) => { const m = m4(W, H); return { toX: m.toX, toY: y => m.toY(y + FC), scale: m.scale }; };
            const phaseIdx = () => PH.reduce((a, p, i) => U.t >= p[1] ? i : a, 0);
            const stature = () => {
                if (U.customStature != null) return U.customStature;
                const u = cl((U.t - TL.stat) / TL.dur), MN = window.SEATED_STAT.min, MX = window.SEATED_STAT.max;
                return MN + (MX - MN) * (1 - Math.cos(Math.PI * u)) / 2;   // sobe do feminino ao masculino e para
            };

            const inTourView = () => !!document.querySelector('#tour-stage #uniCanvas');
            function before(ctx, m) {
                const { toX, toY, scale } = m4(m.W, m.H);   // eixo com y=0 no piso
                ctx.strokeStyle = 'rgba(67, 70, 151, 0.12)'; ctx.lineWidth = 1;
                if (!U.exporting && !inTourView()) {   // a imagem exportada (e o vídeo) saem sem o fundo quadriculado interno
                for (let x = -175; x <= 175; x += 25) { ctx.beginPath(); ctx.moveTo(toX(x), toY(-8)); ctx.lineTo(toX(x), toY(225)); ctx.stroke(); }
                for (let y = 0; y <= 225; y += 25) { ctx.beginPath(); ctx.moveTo(toX(-180), toY(y)); ctx.lineTo(toX(180), toY(y)); ctx.stroke(); }
                }
                const p = cl((U.t - TL.ring) / 0.8);          // trechos laterais da fuselagem até o piso (y=0), sem porão
                if (p > 0) {
                    const aEnd = Math.asin(FC / 137.16);       // ângulo exato onde a parede encontra o piso (y=0)
                    const N = 40;
                    [-1, 1].forEach(side => {
                        ctx.save(); ctx.beginPath();
                        for (let i = 0; i <= N; i++) {
                            const a = -aEnd * p * (i / N);
                            const x = side * 137.16 * Math.cos(a), y = FC + 137.16 * Math.sin(a);
                            i ? ctx.lineTo(toX(x), toY(y)) : ctx.moveTo(toX(x), toY(y));
                        }
                        for (let i = N; i >= 0; i--) {
                            const a = -aEnd * p * (i / N);
                            const x = side * 142.66 * Math.cos(a), y = FC + 137.16 * Math.sin(a);
                            ctx.lineTo(toX(x), toY(y));
                        }
                        ctx.closePath(); ctx.fillStyle = 'rgba(148, 163, 184, 0.35)'; ctx.fill();
                        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2.5;
                        [137.16, 142.66].forEach(rx => {   // só as duas paredes (sem a reta horizontal de emenda)
                            ctx.beginPath();
                            for (let i = 0; i <= N; i++) {
                                const a = -aEnd * p * (i / N);
                                const x = side * rx * Math.cos(a), y = FC + 137.16 * Math.sin(a);
                                i ? ctx.lineTo(toX(x), toY(y)) : ctx.moveTo(toX(x), toY(y));
                            }
                            ctx.stroke();
                        });
                        ctx.restore();
                    });
                }
                const pf = ph(TL.floor, 0.6);                  // piso da cabine, abrindo a partir do centro
                if (pf > 0) {
                    ctx.fillStyle = '#cbd5e1'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.8;
                    ctx.fillRect(toX(-126 * pf), toY(0), 252 * pf * scale, 8 * scale);
                    ctx.strokeRect(toX(-126 * pf), toY(0), 252 * pf * scale, 8 * scale);
                }
            }

            // Anotação de primeiro plano ligada ao encosto da janela.
            // Duas linhas mantêm a frase completa entre a cota 78.7" e
            // a curva externa, sem cruzar a linha vertical de altura.
            function drawSeatbackLeader(ctx,W,H,alpha) {
                if (alpha <= 0) return;
                const {toX,toY} = m4(W,H);
                const x0 = toX(-99.5 - 46/2 + 6), y0 = toY(98);
                const label = 'Seatback reclines 20°';
                const labelLines = [label.slice(0, 8), label.slice(9)];
                const labelX = toX(-152) + 9; // mantém o vão entre a cota vertical e o arco
                const labelY = toY(165); // centro da área assinalada, abaixo da posição anterior
                ctx.save();
                ctx.globalAlpha *= alpha;
                ctx.font = 'bold 11px "JetBrains Mono", monospace';
                // A líder começa no canto inferior direito do texto, sem atravessá-lo.
                const leaderX = labelX + ctx.measureText(labelLines[1]).width;
                const leaderY = labelY + 14;
                ctx.strokeStyle = '#7c8b9e'; ctx.lineWidth = 1.2;
                ctx.beginPath(); ctx.moveTo(leaderX, leaderY); ctx.lineTo(x0, y0); ctx.stroke();
                ctx.beginPath(); ctx.arc(x0, y0, 2.1, 0, 2*Math.PI);
                ctx.fillStyle = '#7c8b9e'; ctx.fill();
                ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                ctx.shadowBlur = 0;
                ctx.fillText(labelLines[0], labelX, labelY);
                ctx.fillText(labelLines[1], labelX, labelY + 14);
                ctx.restore();
            }
            // Cotas da seção transversal compartilhadas com a exportação (PNG).
            // A altura geral 78.7" e a largura inferior 108" foram removidas.
            // As cotas dos bins e as folgas individuais permanecem em suas rotinas.
            function drawInteractiveStructureDims(ctx, W, H, alpha, lowerFade=1) {
                if (alpha <= 0) return;
                const { toX, toY } = m4(W, H);
                const C = '#7c8b9e';
                ctx.save();
                ctx.globalAlpha *= alpha;

                // Largura do corredor: acima do arco, junto à fuselagem.
                drawDimensionLine(ctx,
                    toX(-25.4), toY(212), toX(25.4), toY(212),
                    '20"', C, 11, {x:0, y:-11});

                // Altura nominal do assento conforme a cota solicitada.
                // O modelo da cadeira e a antropometria permanecem intactos.
                ctx.globalAlpha *= lowerFade;
                const seatDimY = 16.8 * CM_PER_IN;
                drawDimensionLine(ctx,
                    toX(138), toY(0), toX(138), toY(seatDimY),
                    '16.8"', C, 11, {x:21, y:0},
                    {x1:toX(125), y1:toY(0), x2:toX(142), y2:toY(0)},
                    {x1:toX(125), y1:toY(seatDimY), x2:toX(142), y2:toY(seatDimY)});

                // Altura do encosto na lateral esquerda, sem conflitar com o
                // líder "Seatback reclines 20°" situado acima da cadeira.
                const backDimY = 40.0 * CM_PER_IN;
                drawDimensionLine(ctx,
                    toX(-141), toY(0), toX(-141), toY(backDimY),
                    '40.0"', C, 11, {x:-19, y:0},
                    {x1:toX(-125), y1:toY(0), x2:toX(-145), y2:toY(0)},
                    {x1:toX(-125), y1:toY(backDimY), x2:toX(-145), y2:toY(backDimY)});
                ctx.restore();
            }
            function after(ctx, m) {
                const seats = ph(TL.seats, 0.6), pax = ph(TL.pax, 0.6), st = stature();
                window.drawSeatedScene(ctx, m.W, m.H, {
                    hAisle: st, hWin: st, backAng: window.SEATED_STAT.backAng, map: m4,
                    layers: { seats:seats*(1-cameraAmount()), pax:pax*(1-cameraAmount()), dims:seats*(1-cameraAmount()) }
                });
                // Cotas idênticas na visualização e no canvas de exportação.
                drawInteractiveStructureDims(ctx,m.W,m.H,seats,1-cameraAmount());
                const i = phaseIdx();
                ctx.save(); ctx.font = 'bold 13px "JetBrains Mono", monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#434697';
                if (!U.exporting && !inTourView()) ctx.fillText(`PHASE ${i + 1}/${PH.length} — ${PH[i][0].toUpperCase()}`, 16, m.H - 14); ctx.restore();
            }

            function refresh() {
                U.g = U.g || computeAllGeometries();
                const T1=Math.min(4,U.t/UNI_CAD_SEC);
                if(U.playing && U.t<TL.open)window.__uniRefDoorProgress=0;
                if(U.t>=TL.open)window.__uniRefDoorProgress=doorAmount();
                window.__uniSweepProgress=U.t>=TL.open?doorAmount():0;
                const slider=document.getElementById('uni-bin-door-slider'),pct=document.getElementById('uni-bin-door-pct');
                if(U.t>=TL.open){if(slider)slider.value=Math.round(100*window.__uniRefDoorProgress);if(pct)pct.textContent=Math.round(100*window.__uniRefDoorProgress)+'%'}
                window.BIN_SOLID = true; window.BIN_DARK = true;   // paleta escura (#5b7b9e · #9ba9b5 · #bababa, poltronas #2f4a6b) também na tela
                try {
                    drawCADCanvas(U.g, { canvasId: 'uniCanvas', referenceBins: true, noBags: true, noLegend: inTourView(), finalDims: true, minimalDims: true, T: T1, map: m1, camera:cinematicCamera, noGrid: true, dimFade: 1 - ph(TL.ring, 0.5), fade: U.fx || null, before, after });
                    if (U.focus > 0) {   // foco no passageiro da janela (ponta esquerda): o resto do desenho cai para ~18% de opacidade (a malha do quadro não muda)
                        const cvs = document.getElementById('uniCanvas'), box = cvs.parentElement, W = box.offsetWidth, H = box.offsetHeight;
                        const m = m4(W, H), g2 = cvs.getContext('2d'), dpr = cvs.width / Math.max(1, W);
                        const head = 40.64 + stature() * 0.51 * Math.cos(window.SEATED_STAT.backAng * Math.PI / 180);
                        // recorte no formato do passageiro + poltrona (corpo largo até o encosto, cabeça mais estreita), sem pegar a parede nem o piso
                        const hole = [[-125.7, 0], [-125.7, 101], [-115, 101], [-115, head + 5], [-84, head + 5], [-84, 101], [-72.8, 101], [-72.8, 0]];
                        g2.save(); g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.globalCompositeOperation = 'destination-out';
                        g2.fillStyle = `rgba(0,0,0,${(0.82 * U.focus).toFixed(3)})`;
                        g2.beginPath(); g2.rect(0, 0, W, H);
                        hole.forEach(([x, y], i) => i ? g2.lineTo(m.toX(x), m.toY(y)) : g2.moveTo(m.toX(x), m.toY(y))); g2.closePath();
                        g2.fill('evenodd');
                        g2.restore();
                    }
                    // A anotação entra depois do mascaramento de foco,
                    // portanto nunca fica atrás do passageiro à esquerda.
                    const cv=document.getElementById('uniCanvas');
                    const parent=cv&&cv.parentElement;
                    if(parent){
                        const rect=parent.getBoundingClientRect();
                        if(rect.width>0&&rect.height>0){
                            const ctx=cv.getContext('2d');
                            ctx.save();
                            ctx.setTransform(cv.width/rect.width,0,0,
                                cv.height/rect.height,0,0);
                            drawSeatbackLeader(ctx,rect.width,rect.height,ph(TL.seats,0.6)*(1-cameraAmount()));
                            ctx.restore();
                        }
                    }
                } finally { window.BIN_SOLID = false; window.BIN_DARK = false; }
                const ico = U.playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : (U.t >= TOTAL - 0.01 ? '<path d="M12 5V2L7 6l5 4V7a5 5 0 11-5 5H5a7 7 0 107-7z"/>' : '<path d="M7 4l13 8-13 8z"/>');
                const _uniPlay = document.getElementById('uni-play'); if (_uniPlay) _uniPlay.innerHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">${ico}</svg>${U.playing ? 'Pause' : (U.t >= TOTAL - 0.01 ? 'Replay' : 'Play')}`;
                if (_uniScrub) _uniScrub.value = U.t;
                gaugeUpdate();
                {   // roteiro/vídeo: a escala de estatura é ampliada junto com o quadro (referência: 1920 px de largura)
                    const mod = document.getElementById('module-unified'), asd = mod && mod.querySelector('aside');
                    if (asd) asd.style.transform = (mod.closest('#tour-stage') && mod.clientWidth) ? `scale(${(1.113 * mod.clientWidth / 1920).toFixed(4)})` : '';
                }
                {   // roteiro/vídeo: "* Approximate values" no rodapé do quadro, ao lado do canto inferior direito
                    const mod = document.getElementById('module-unified'), asd = mod && mod.querySelector('aside');
                    const note = asd && asd.querySelector('.uni-note'), stg = mod && mod.closest('#tour-stage');
                    if (note) {
                        if (stg && stg.offsetWidth && asd.offsetWidth) {
                            const sr = stg.getBoundingClientRect(), ar = asd.getBoundingClientRect();
                            const ks = sr.width / stg.offsetWidth, sc = ar.width / asd.offsetWidth;
                            note.style.marginTop = '0';
                            note.style.right = ((ar.right - (sr.right - 50 * ks)) / sc) + 'px';
                            note.style.top = (((sr.bottom - 30 * ks) - ar.top) / sc - note.offsetHeight / 2) + 'px';
                        } else { note.style.right = ''; note.style.top = ''; note.style.marginTop = ''; }
                    }
                }
                const act = phaseIdx();
                document.querySelectorAll('#uni-chips .cad-chip').forEach((c, i) => { c.classList.toggle('on', i === act && U.t < TOTAL - 0.01); c.classList.toggle('done', i < act || U.t >= TOTAL - 0.01); });
            }

            // ---- Barra vertical de estatura + marcos (percentil feminino → média mundial → percentil masculino) ----
            const G_LO = 145, G_HI = 195, WORLD_MEAN_CM = 165;      // média mundial ≈ (159 F + 171 M) / 2
            const MARKS = [
                { id: 'f', cm: window.SEATED_STAT.min, name: 'P5 Female', col: '#6d90b8' },
                { id: 'w', cm: WORLD_MEAN_CM, name: 'P50 World', col: '#9ba9b5' },
                { id: 'm', cm: window.SEATED_STAT.max, name: 'P95 Male', col: '#d4dce6' }
            ];
            const gp = cm => cl((cm - G_LO) / (G_HI - G_LO)) * 100;
            const dec = v => v.toFixed(1);
            const gEl = document.getElementById('uni-gauge');
            if (gEl) gEl.innerHTML =
                '<div style="position:absolute;left:58px;top:0;bottom:0;width:14px;border-radius:7px;background:#0a1a3a;border:1px solid #5b7b9e"></div>' +
                '<div id="uni-g-fill" style="position:absolute;left:58px;bottom:0;width:14px;border-radius:7px;background:#5b7b9e;opacity:.95;height:0"></div>' +
                [59, 63, 67, 71, 75].map(v => `<div style="position:absolute;left:0;width:50px;bottom:${gp(v * CM_PER_IN)}%;transform:translateY(50%);font:12px 'JetBrains Mono',monospace;color:#9ba9b5;text-align:right">${v}"</div><div style="position:absolute;left:52px;width:6px;bottom:${gp(v * CM_PER_IN)}%;border-top:1px solid #5b7b9e"></div>`).join('') +
                MARKS.map(m => `<div id="uni-mk-${m.id}" style="position:absolute;left:52px;right:0;bottom:${gp(m.cm)}%;height:0;border-top:2px dashed ${m.col};opacity:.55;transition:opacity .2s">` +
                    `<div id="uni-ml-${m.id}" style="position:absolute;left:30px;bottom:3px;font:14px 'JetBrains Mono',monospace;font-weight:400;line-height:1.25;color:${m.col};white-space:nowrap">${m.name}<br>${fmtIn(m.cm, 1)}</div></div>`).join('') +
                '<div id="uni-g-cur" style="position:absolute;left:0;width:56px;bottom:0;transform:translateY(50%);text-align:right;opacity:.3"><span id="uni-g-curv" style="display:inline-block;padding:1px 5px;border-radius:4px;background:#9ba9b5;color:#000223;font:bold 13px \'JetBrains Mono\',monospace">--</span></div>' +
                '<div id="uni-g-ptr" style="position:absolute;left:56px;width:22px;bottom:0;height:0;border-top:3px solid #bababa;opacity:.3"></div>';
            function gaugeUpdate() {
                const st = stature(), live = U.t >= TL.pax + 0.6 - 0.01;
                const set = (id, k, v) => { const el = document.getElementById(id); if (el) el.style[k] = v; };
                set('uni-g-fill', 'height', gp(st) + '%');
                ['uni-g-cur', 'uni-g-ptr'].forEach(id => { set(id, 'bottom', gp(st) + '%'); set(id, 'opacity', live ? 1 : 0.3); });
                const _uniCurv = document.getElementById('uni-g-curv'); if (_uniCurv) _uniCurv.textContent = live ? dec(st / CM_PER_IN) + '"' : '--';
                const here = MARKS.find(m => Math.abs(st - m.cm) < 0.8);
                MARKS.forEach(m => {
                    set('uni-mk-' + m.id, 'opacity', live && st >= m.cm - 0.05 ? 1 : 0.55);
                    set('uni-mk-' + m.id, 'borderTopStyle', live && here === m ? 'solid' : 'dashed');
                    set('uni-ml-' + m.id, 'fontWeight', live && st >= m.cm - 0.05 ? '700' : '400');   // negrito quando a escala passa pelo percentil
                });
            }
            function tick(now) {
                if (!U.playing) return;
                U.t = Math.min(TOTAL, U.t + Math.min(0.05, (now - U.last) / 1000)); U.last = now;
                if (U.t >= TOTAL) U.playing = false;
                refresh();
                if (U.playing) U.raf = requestAnimationFrame(tick);
            }
            function play(from) {
                if (from != null) U.t = from;
                if(U.t<TL.open){window.__uniRefDoorProgress=0;window.__uniSweepProgress=0;}
                U.playing = true; U.last = performance.now();
                cancelAnimationFrame(U.raf); U.raf = requestAnimationFrame(tick); refresh();
            }
            const _uniChips = document.getElementById('uni-chips'); if (_uniChips) _uniChips.innerHTML = PH.map((p, i) => `<button type="button" class="cad-chip" onclick="uniGo(${i})">${i + 1}. ${p[0]}</button>`).join('');
            // Tempo exato na fase 4 em que a curva de estatura passa por WORLD_MEAN_CM (165,0 cm)
            const T_WORLD_MEAN = TL.stat + TL.dur * Math.acos(1 - 2 * (WORLD_MEAN_CM - window.SEATED_STAT.min) / (window.SEATED_STAT.max - window.SEATED_STAT.min)) / Math.PI;

            window.uniGo = i => { U.customStature = null; if(i===0)window.__uniRefDoorProgress=0; play(PH[i][1]); };
            window.uniTogglePlay = () => { U.customStature = null; if (U.playing) { U.playing = false; refresh(); } else play(U.t >= TOTAL - 0.01 ? 0 : U.t); };
            window.uniScrub = v => { U.customStature = null; U.playing = false; U.t = parseFloat(v); if(U.t<TL.open)window.__uniRefDoorProgress=0; refresh(); };
            window.uniPause = () => { if (U.playing) { U.playing = false; cancelAnimationFrame(U.raf); } };
            window.uniRefresh = refresh;
            window.uniEnter = () => { if (!U.started) { U.started = true; play(0); } else refresh(); };
            // roteiro (aba 8): zera sem autoplay e inicia uma única vez (evita começar, parar e reiniciar)
            window.uniTourReset = () => { U.started = true; U.customStature = null; U.playing = false; cancelAnimationFrame(U.raf); U.t = 0; U.fx = null; U.focus = 0; window.__uniRefDoorProgress=0; window.__uniSweepProgress=0; refresh(); };
            window.uniTourStart = () => { U.started = true; if (!U.playing) play(0); };
            window.uniTourSet = t => { U.started = true; U.customStature = null; U.playing = false; cancelAnimationFrame(U.raf); U.t = t; U.fx = null; U.focus = 0; refresh(); };
            window.uniSetFx = (f, focus) => { U.fx = f ? Object.assign({}, f) : null; U.focus = focus || 0; refresh(); };
            window.uniTourStartAt = t => { U.started = true; U.customStature = null; play(t); };
            // Simulação Completa: geometria em px do .sim-bg (canvas) — passageiro da ponta esquerda (janela, convencional) e eixo da fuselagem
            window.uniGeom = () => {
                const cvs = document.getElementById('uniCanvas'), box = cvs && cvs.parentElement; if (!box) return null;
                const r = box.getBoundingClientRect(), m = m4(r.width, r.height);
                const head = 40.64 + window.SEATED_STAT.max * 0.51 * Math.cos(window.SEATED_STAT.backAng * Math.PI / 180);
                return { box, paxX: m.toX(-99.5), floorY: m.toY(0), headY: m.toY(head), paxW: 46 * m.scale, axisY: m.toY(FC), scale: m.scale };
            };

            // opts.stat = 'p95' → estatura P95 Male (fim da fase de estatura); padrão = Média Mundial.  opts.transparent = true → PNG sem fundo.
            window.uniExport4K = (opts) => {
                const o = (opts && typeof opts === 'object' && !opts.target) ? opts : {};
                const isP95 = o.stat === 'p95';
                const statCm = isP95 ? window.SEATED_STAT.max : WORLD_MEAN_CM;
                const statName = isP95 ? 'P95 MALE' : 'WORLD AVERAGE';
                // Posiciona a simulação exatamente na estatura exportada (Média Mundial 165,0 cm / 65,0" ou P95 Male)
                const prev = { t: U.t, custom: U.customStature, playing: U.playing,door:window.__uniRefDoorProgress };
                U.exporting = true; window.EXPORT_EN = true;
                U.playing = false;
                cancelAnimationFrame(U.raf);
                const exportFinalDoorState=prev.t>=TOTAL-.01;
                U.t=exportFinalDoorState?TOTAL:(isP95?TL.pause:T_WORLD_MEAN);
                U.customStature=exportFinalDoorState?window.SEATED_STAT.max:statCm;
                refresh();

                // Cria canvas offscreen em resolução 4K UHD (3840 × 2160 = 1920×1080 com dpr=2 para nitidez proporcional perfeita)
                const offscreen = document.createElement('canvas');
                U.g = U.g || computeAllGeometries();
                const T1=Math.min(4,U.t/UNI_CAD_SEC);
                if(U.playing && U.t<TL.open)window.__uniRefDoorProgress=0;
                if(U.t>=TL.open)window.__uniRefDoorProgress=doorAmount();
                window.__uniSweepProgress=U.t>=TL.open?doorAmount():0;
                const slider=document.getElementById('uni-bin-door-slider'),pct=document.getElementById('uni-bin-door-pct');
                if(U.t>=TL.open){if(slider)slider.value=Math.round(100*window.__uniRefDoorProgress);if(pct)pct.textContent=Math.round(100*window.__uniRefDoorProgress)+'%'}
                window.BIN_SOLID = true; window.BIN_DARK = o.palette === 'dark';
                try {
                drawCADCanvas(U.g, {
                    canvas: offscreen,
                    referenceBins: true,
                    noBags: true,
                    width: 1920,
                    height: 1080,
                    dpr: 2,
                    bgFill: o.transparent ? null : '#f5f5f5',   // null → PNG com fundo transparente
                    T: T1,
                    map: m1,                    noGrid: true,
                    finalDims: true,
                    minimalDims: true,
                    dimFade: 1 - ph(TL.ring, 0.5),
                    before,
                    after: (ctx, m) => {
                        after(ctx, m);
                        // Selo discreto no canto inferior direito indicando a estatura exportada
                        ctx.save();
                        ctx.font = 'bold 13px "JetBrains Mono", monospace';
                        ctx.textAlign = 'right';
                        ctx.fillStyle = '#0e7490';
                        if(!exportFinalDoorState)ctx.fillText(`STATURE: ${statName} (${fmtIn(statCm, 1)})`, m.W - 20, m.H - 14);
                        ctx.restore();
                        drawSeatbackLeader(ctx,m.W,m.H,ph(TL.seats,0.6)*(1-cameraAmount()));
                    }

            });

            const O=SUBS[0];
            const near=(y,z)=>O.reduce((a,p)=>Math.hypot(p[0]-y,p[1]-z)<Math.hypot(a[0]-y,a[1]-z)?p:a);
            const cp=[];[FLOOR_SEAT[0],FLOOR_SEAT[FLOOR_SEAT.length-1]].forEach(p=>cp.push(0,p[1],-p[0],DIST,p[1],-p[0]));
            const cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.Float32BufferAttribute(cp,3));
            group.add(new THREE.LineSegments(cg,lmat));

            // Trilho e Porta Rolante Vertical (5 mm)
            // Linha central interpolada das DUAS bordas do trilho vermelho do SVG.
            const railPts2D=DOOR_GUIDE.map(p=>new THREE.Vector2(p[0],p[1]));
            
            const railCurve=new THREE.CatmullRomCurve3(
                railPts2D.map(p=>new THREE.Vector3(0, p.y, -p.x)),
                false, 'centripetal', 0.25
            );
            const totalRailLen=railCurve.getLength();

            const railSamplePts=railCurve.getSpacedPoints(220);
            const railLineMat=new THREE.LineBasicMaterial({color:0x1e293b});
            [TH/2+0.5, DIST-TH/2-0.5].forEach(xPos=>{
                const arr=[];
                for(let i=0;i<railSamplePts.length-1;i++){

            });

            const DOOR_THICK = 5.0;
            const DOOR_WIDTH = DIST - TH;
            const SLAT_SUB   = 3;                         // cada ripa é dividida em 3 tiras finas: nas curvas do trilho elas acompanham o arco sem formar "quinas"
            const NUM_SLATS  = 24 * SLAT_SUB;
            const SLAT_PITCH = 24.5 / SLAT_SUB;
            const MAX_TRAVEL = Math.max(0, totalRailLen - NUM_SLATS * SLAT_PITCH - 8);  // não ultrapassa o fim do trilho

            const doorMat=new THREE.MeshBasicMaterial({color:0xd4d7ea,side:THREE.DoubleSide,...po});   // porta rolante: lavanda clara (render SVG)
            const handleMat=new THREE.MeshBasicMaterial({color:0x7b86b0,side:THREE.DoubleSide});
            const slatEdgeMat=new THREE.LineBasicMaterial({color:0x1e293b});   // divisões da porta: traço CAD #1e293b

            const slats=[];
            const slatGeo=new THREE.BoxGeometry(DOOR_WIDTH, SLAT_PITCH*1.04, DOOR_THICK);   // fatias coladas (leve sobreposição, sem frestas nas curvas)
            const slatEdges=new THREE.EdgesGeometry(slatGeo);

            for(let i=0; i<NUM_SLATS; i++){
                const slatGroup=new THREE.Group();
                const mesh=new THREE.Mesh(slatGeo, doorMat);
                const edges=new THREE.LineSegments(slatEdges, slatEdgeMat);
                slatGroup.add(mesh);
                if(i % SLAT_SUB === 0) slatGroup.add(edges);   // linhas só a cada ripa original (mesma aparência de antes)
                if(i===0){
                    const hGeo=new THREE.BoxGeometry(150, 10, DOOR_THICK+0.6);
                    const hMesh=new THREE.Mesh(hGeo, handleMat);

                    slatGroup.add(hEdges);

                group.add(slatGroup);
                solids.push(mesh);

            }

            let openProgress = 0;
            function updateDoor(progress){
                openProgress = Math.max(0, Math.min(1, progress));
                topWall.forEach(o=>{ o.visible = false; });   // placa do teto (QS[0]) removida da vista em qualquer abertura
                const startS = openProgress * MAX_TRAVEL;
                for(let i=0; i<NUM_SLATS; i++){
                    const s = startS + (i + 0.5) * SLAT_PITCH;
                    const u = Math.min(0.995, Math.max(0.005, s / totalRailLen));
                    const pt = railCurve.getPointAt(u);
                    const tan = railCurve.getTangentAt(u);
                    const angle = Math.atan2(tan.z, tan.y);
                    const sg = slats[i];
                    sg.position.set(DIST/2, pt.y, pt.z);
                    sg.rotation.set(-angle, 0, 0);
                }
            }
            updateDoor(0);

            // Âncora do balão "TAMBOUR DOOR": uma ripa do meio do topo da porta fechada (o ponto acompanha a porta ao abrir/fechar)
            let doorAnchorSlat = null;
            (function(){
                let top = -Infinity; slats.forEach(sg => { if (sg.position.y > top) top = sg.position.y; });
                const flat = slats.filter(sg => sg.position.y > top - 2);
                doorAnchorSlat = flat[Math.floor(flat.length / 2)] || slats[Math.floor(slats.length / 2)];
            })();
            const _balloons = container.querySelector('.cad3d-balloons');
            const _bLine = document.getElementById('cb-line'), _bDot = document.getElementById('cb-dot'), _bSvg = _balloons ? _balloons.querySelector('.cb-lead') : null;
            const _bDoor = _balloons ? _balloons.querySelector('.cb-door') : null;
            const _bV = new THREE.Vector3();
            function placeBalloons(){

                const x = (_bV.x * 0.5 + 0.5) * W, y = (-_bV.y * 0.5 + 0.5) * H;

                _bSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
                _bLine.setAttribute('x1', x1); _bLine.setAttribute('y1', y1); _bLine.setAttribute('x2', x); _bLine.setAttribute('y2', y);
                _bLine.setAttribute('stroke-width', Math.max(1.5, W * 2 / 1920).toFixed(2));   // linha de chamada fina (HUD)
                _bDot.setAttribute('cx', x); _bDot.setAttribute('cy', y); _bDot.setAttribute('r', Math.max(3, W * 6 / 1920).toFixed(2));
            }

            // Modelo da Mala de Cabine IATA (22 x 14 x 10 in)
            const mPl=new THREE.MeshLambertMaterial({color:0x4c598e,...po});   // nervuras/placas das malas: azul médio (render SVG)
            const mBlk=new THREE.MeshLambertMaterial({color:0x2a3358,...po});   // rodas e alças: azul quase preto (render SVG)
            const mMet=new THREE.MeshLambertMaterial({color:0x6c769c,...po});
            const bagEdgeMat=new THREE.LineBasicMaterial({color:0x38bdf8,transparent:true,opacity:0.4});   // arestas das malas: ciano HUD (#38bdf8, 40%) sobre o azul escuro

            function rr(w,h,r,y){
                const s=new THREE.Shape(),x=-w/2,X=w/2,Y=y+h;
                s.moveTo(x+r,y);s.lineTo(X-r,y);s.quadraticCurveTo(X,y,X,y+r);s.lineTo(X,Y-r);s.quadraticCurveTo(X,Y,X-r,Y);
                s.lineTo(x+r,Y);s.quadraticCurveTo(x,Y,x,Y-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
                return s;
            }

            const bagShape=rr(346,495,50,50);
            const bagBodyGeo=new THREE.ExtrudeGeometry(bagShape,{depth:212,bevelEnabled:true,bevelThickness:18,bevelSize:18,bevelOffset:-18,bevelSegments:5,curveSegments:10});
            bagBodyGeo.translate(0,0,-106);

            function createSuitcase(bodyColorHex, withDims){
                const root = new THREE.Group();
                const inner = new THREE.Group();
                inner.position.y = -279.5;
                root.add(inner);

                const mBody = new THREE.MeshLambertMaterial({color:bodyColorHex,...po});
                function part(geo,matP,x,y,z,rz,ang){
                    const m=new THREE.Mesh(geo,matP);m.position.set(x,y,z);if(rz)m.rotation.z=rz;
                    inner.add(m);solids.push(m);
                    const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo,ang||30),bagEdgeMat);
                    l.position.copy(m.position);l.rotation.copy(m.rotation);inner.add(l);
                }

                    inner.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(p),bagEdgeMat));

                [-1,1].forEach(s=>{

                    }

            const bags = [
                createSuitcase(0x32407a, true),  // 1a mala: deitada (fundo esquerdo) com cotas amarelas
                createSuitcase(0x32407a, false), // 2a mala: deitada (fundo direito)
                createSuitcase(0x32407a, false), // 3a mala: em pe (frente esquerda)
                createSuitcase(0x32407a, false)  // 4a mala: em pe (frente direita)
            ];

            const X_LEFT  = 292;
            const X_RIGHT = 865;

            // Encaixe no perfil lateral real: U = -Z e H = Y (mm).
            // A quebra do piso em FLOOR_SEAT[8] separa a rampa de 360,68 mm
            // do piso frontal de 265,09 mm (ângulo interno próximo de 168°).
            // Os 356 x 254 mm são as dimensões EXTERNAS da seção da mala IATA,
            // incluindo o envelope das rodas e alças: não posicionar só pelo casco.
            const floorRear = FLOOR_SEAT[0], floorJoint = FLOOR_SEAT[8];
            const floorFront = FLOOR_SEAT[FLOOR_SEAT.length - 1];
            const floorAngle = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
            const rearSlope = floorAngle(floorRear, floorJoint);
            const frontSlope = floorAngle(floorJoint, floorFront);
            const BAG_LONG_HALF = 356 / 2, BAG_THICK_HALF = 254 / 2;
            const PROFILE_GAP = 1.5; // folga técnica mínima para evitar z-fighting/penetração

            // Mala deitada: a aresta traseira acompanha a parede oblíqua de ~259 mm,
            // e a aresta inferior acompanha o primeiro segmento do piso.
            // Pequeno recuo longitudinal compensa a discretização do contorno SVG.
            function pointOnFloor(a, angle, along, normal) {
                return {
                    u: a[0] + along * Math.cos(angle) - normal * Math.sin(angle),
                    h: a[1] + along * Math.sin(angle) + normal * Math.cos(angle)
                };
            }
            const rearFoot = pointOnFloor(floorRear, rearSlope, 2.5, PROFILE_GAP);
            const lowerCenter = {
                u: rearFoot.u + BAG_LONG_HALF * Math.cos(rearSlope) - BAG_THICK_HALF * Math.sin(rearSlope),
                h: rearFoot.h + BAG_LONG_HALF * Math.sin(rearSlope) + BAG_THICK_HALF * Math.cos(rearSlope)
            };
            const LOWER_BAG_TILT = -Math.PI / 2 + rearSlope;

            // Mala em pé: sua base acompanha o segundo segmento do piso; a face
            // traseira inclina ~5° para trás, paralela à divisória de 124,25 mm.
            // O início da base fica perto da quebra para não colidir com a mala deitada.
            const frontFoot = pointOnFloor(floorJoint, frontSlope, -2.8, PROFILE_GAP);
            const uprightCenter = {
                u: frontFoot.u + BAG_THICK_HALF * Math.cos(frontSlope) - BAG_LONG_HALF * Math.sin(frontSlope),
                h: frontFoot.h + BAG_THICK_HALF * Math.sin(frontSlope) + BAG_LONG_HALF * Math.cos(frontSlope)
            };
            const UPRIGHT_BAG_TILT = frontSlope;

            // As duas malas de cada tipo ficam em fileiras distintas no eixo X;
            // a exportação lateral em corte usa apenas um exemplar de cada perfil.
            const BAG_PATHS = [
                {
                    p0: new THREE.Vector3(X_LEFT, 340, -1320), r0: new THREE.Euler(0, Math.PI, 0),
                    p1: new THREE.Vector3(X_LEFT, 321, -920),  r1: new THREE.Euler(-1.38, 0, Math.PI/2),
                    p2: new THREE.Vector3(X_LEFT, lowerCenter.h, -lowerCenter.u),
                    r2: new THREE.Euler(LOWER_BAG_TILT, 0, Math.PI/2)
                },
                {
                    p0: new THREE.Vector3(X_RIGHT, 340, -1320), r0: new THREE.Euler(0, Math.PI, 0),
                    p1: new THREE.Vector3(X_RIGHT, 321, -920),  r1: new THREE.Euler(-1.38, 0, Math.PI/2),
                    p2: new THREE.Vector3(X_RIGHT, lowerCenter.h, -lowerCenter.u),
                    r2: new THREE.Euler(LOWER_BAG_TILT, 0, Math.PI/2)
                },
                {
                    p0: new THREE.Vector3(X_LEFT, 345, -1320), r0: new THREE.Euler(0, Math.PI, 0),
                    p1: new THREE.Vector3(X_LEFT, 345, -1020), r1: new THREE.Euler(-0.0087, 0, Math.PI/2),
                    p2: new THREE.Vector3(X_LEFT, uprightCenter.h, -uprightCenter.u),
                    r2: new THREE.Euler(UPRIGHT_BAG_TILT, 0, Math.PI/2)
                },
                {
                    p0: new THREE.Vector3(X_RIGHT, 345, -1320), r0: new THREE.Euler(0, Math.PI, 0),
                    p1: new THREE.Vector3(X_RIGHT, 345, -1020), r1: new THREE.Euler(-0.0087, 0, Math.PI/2),
                    p2: new THREE.Vector3(X_RIGHT, uprightCenter.h, -uprightCenter.u),
                    r2: new THREE.Euler(UPRIGHT_BAG_TILT, 0, Math.PI/2)
                }
            ];

            // Teste de separação (SAT) entre os retângulos do envelope técnico no corte Y-Z.
            // Em particular, não permitir interseção na quebra do piso.
            function sectionRect(foot, angle, longitudinal, transverse) {
                const tx = Math.cos(angle), ty = Math.sin(angle);
                const nx = -ty, ny = tx;
                return [
                    [foot.u, foot.h],
                    [foot.u + longitudinal * tx, foot.h + longitudinal * ty],
                    [foot.u + longitudinal * tx + transverse * nx, foot.h + longitudinal * ty + transverse * ny],
                    [foot.u + transverse * nx, foot.h + transverse * ny]
                ];
            }
            function sectionGap(a, b) {
                let separation = -Infinity;
                [a, b].forEach(poly => {
                    for (let i = 0; i < poly.length; i++) {
                        const p = poly[i], q = poly[(i + 1) % poly.length];
                        const d = Math.hypot(q[0] - p[0], q[1] - p[1]);
                        const nx = -(q[1] - p[1]) / d, ny = (q[0] - p[0]) / d;
                        const proj = v => v.map(p => p[0] * nx + p[1] * ny);
                        const pa = proj(a), pb = proj(b);
                        separation = Math.max(separation,
                            Math.min(...pa) - Math.max(...pb),
                            Math.min(...pb) - Math.max(...pa));
                    }
                });
                return separation; // >= 0: separados, < 0: interseção
            }
            const sectionClearance = sectionGap(
                sectionRect(rearFoot, rearSlope, 356, 254),
                sectionRect(frontFoot, frontSlope, 254, 356)
            );
            if (sectionClearance < 0) {
                console.warn('CAD 3D: envelopes das malas se interceptam no corte:', sectionClearance);
            }

            function smoothstep(t){
                const x = Math.max(0, Math.min(1, t));
                return x * x * (3 - 2 * x);
            }

            // Colisão das malas deitadas com as superfícies internas do perfil SVG.
            // Amostra os extremos do casco (incluindo espessura/chanfro), e não só o centro.
            const lowerBagSamples = [];
            bagShape.getPoints(32).forEach(p => {
                for (const depth of [-127, 127]) {
                    lowerBagSamples.push(new THREE.Vector3(p.x, 0, depth));
                }
            });
            function interiorFloor(profileX) {
                for (let i = 0; i < FLOOR_SEAT.length - 1; i++) {
                    const a = FLOOR_SEAT[i], b = FLOOR_SEAT[i + 1];
                    if (profileX >= Math.min(a[0], b[0]) &&
                        profileX <= Math.max(a[0], b[0]) && Math.abs(b[0] - a[0]) > 1e-7) {
                        return a[1] + (profileX - a[0]) * (b[1] - a[1]) / (b[0] - a[0]);
                    }
                }
                return null;
            }
            function interiorCeiling(profileX) {
                let highest = -Infinity;
                for (let i = 0; i < WALL_SEAT.length - 1; i++) {
                    const a = WALL_SEAT[i], b = WALL_SEAT[i + 1], dx = b[0] - a[0];
                    if (Math.abs(dx) < 1e-7) continue;
                    if (profileX >= Math.min(a[0], b[0]) &&
                        profileX <= Math.max(a[0], b[0])) {
                        highest = Math.max(highest, a[1] +
                            (profileX - a[0]) * (b[1] - a[1]) / dx);
                    }
                }
                return Number.isFinite(highest) ? highest : null;
            }
            function fitLowerBagToFloorAndRoof(b) {
                // Deslocamento vertical admissível pelo piso e pelo teto (folga de 2,5 mm).
                // Um único clamp evita que uma correção contra o teto atravesse o piso.
                let minY = -Infinity, maxY = Infinity, checked = 0;
                for (const p of lowerBagSamples) {
                    const v = p.clone().applyQuaternion(b.quaternion);
                    const profileX = -(b.position.z + v.z);
                    const bottom = interiorFloor(profileX);
                    const top = interiorCeiling(profileX);
                    if (bottom === null || top === null) continue;
                    minY = Math.max(minY, bottom + 2.5 - v.y);
                    maxY = Math.min(maxY, top - 2.5 - v.y);
                    checked++;
                }
                if (checked && minY <= maxY) {
                    b.position.y = Math.max(minY, Math.min(maxY, b.position.y));
                } else if (checked && minY > maxY) {
                    console.warn('CAD 3D: folga insuficiente para a mala inferior no perfil.');
                }
            }

            function setBagPoseAlongPath(bagIdx, u, target){
                const b = target || bags[bagIdx].root;
                const path = BAG_PATHS[bagIdx];
                const q0 = new THREE.Quaternion().setFromEuler(path.r0);
                const q1 = new THREE.Quaternion().setFromEuler(path.r1);
                const q2 = new THREE.Quaternion().setFromEuler(path.r2);

                // Curva de Bézier quadrática contínua (sem parada brusca no meio do caminho em u=0.5)
                const om = 1 - s;
                b.position.set(
                    om * om * path.p0.x + 2 * om * s * path.p1.x + s * s * path.p2.x,
                    om * om * path.p0.y + 2 * om * s * path.p1.y + s * s * path.p2.y,
                    om * om * path.p0.z + 2 * om * s * path.p1.z + s * s * path.p2.z
                );
                if (s <= 0.5) {
                    b.quaternion.slerpQuaternions(q0, q1, smoothstep(s / 0.5));
                } else {
                    b.quaternion.slerpQuaternions(q1, q2, smoothstep((s - 0.5) / 0.5));
                }

            }

            const slider = document.getElementById('cad3d-doorSlider');
            const pctLabel = document.getElementById('cad3d-doorPct');
            const btnToggle = document.getElementById('cad3d-toggleDoor');
            const btnStartSim = document.getElementById('cad3d-startSim');
            const btnResetSim = document.getElementById('cad3d-resetSim');

            let simReq = null;
            let simStartTime = 0;
            let doorAnimReq = null;
            let doorAnimTarget = 0;

            const T = new THREE.Vector3(DIST/2, 330, -620);
            let az = -2.25, el = 0.28, R = 3100;
            const views = {
                iso: [-2.25, 0.28, 3100],
                side: [0, 0, 2600],
                front: [-Math.PI/2, 0, 2800],
                top: [0, Math.PI/2 - 0.001, 2800]
            };

            function upd(){
                cam.position.set(T.x + R*Math.cos(el)*Math.cos(az), T.y + R*Math.sin(el), T.z + R*Math.cos(el)*Math.sin(az));
                cam.lookAt(T);
                const exterior=cam.position.x<-TH/2?0:(cam.position.x>DIST+TH/2?1:-1);
                [...profileBandMeshes,...internalRailParts].forEach(o=>{o.visible=exterior!==o.userData.innerWallSide;});
                ren.render(scene, cam);
                placeBalloons();
            }

            // Pré-aquece a GPU: compila os shaders e envia a geometria das 4 malas ANTES da simulação.
            // Sem isso, as malas 3 e 4 são enviadas à GPU no meio da animação (quando "entram"), o que travava/derrubava o contexto WebGL durante a gravação.
            let warmed = false;
            function warmUp(){
                if(warmed) return; warmed = true;

                    setBagPoseAlongPath(3, u);

                if (!morphSaved.has(m)) morphSaved.set(m, { t: m.transparent, o: m.opacity, d: m.depthWrite });
                const b = morphSaved.get(m);
                m.transparent = true;                       // exigido para a opacidade valer
                m.opacity = b.o + (to - b.o) * k;

                const visEnd = 2 * RrN * tanN * ch / colH;                                     // altura (mundo) visível no canvas inteiro ao final
                const az0 = az, el0 = el, fov0 = cam.fov, T0 = T.clone(), vis0 = 2 * R * Math.tan(fov0 * Math.PI / 360);
                const dx = o.cx != null ? cw / 2 - o.cx : (cw - colW) / 2, dy = o.cy != null ? ch / 2 - o.cy : (ch - colH) / 2;   // o bin vai do centro do canvas ao centro da coluna ALPHA
                const ez = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;    // ease in-out cúbico
                const envMats = []; bags.forEach(b => { if (b.env) envMats.push(...morphMatsOf(b.env)); });

                    az = az0 + (-Math.PI / 2 - az0) * k;                                        // rumo = vista de cima da aba 2
                    el = el0 + (Math.PI / 2 - 0.001 - el0) * k;

                    envMats.forEach(m => morphSet(m, 0, km));                                   // cotas das malas somem

            function drawTopDimension(ctx, x1, x2, yDim, yExt, label) {
                ctx.save();
                ctx.setLineDash([]);
                ctx.strokeStyle = '#FFFFFF';
                ctx.fillStyle = '#FFFFFF';
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.moveTo(x1, yExt); ctx.lineTo(x1, yDim - 7);
                ctx.moveTo(x2, yExt); ctx.lineTo(x2, yDim - 7);
                ctx.moveTo(x1, yDim); ctx.lineTo(x2, yDim);
                ctx.stroke();
                // Setas triangulares sólidas, apontadas para fora da medida.
                [[x1, -1], [x2, 1]].forEach(([x, d]) => {
                    ctx.beginPath();
                    ctx.moveTo(x + d * 10, yDim);
                    ctx.lineTo(x, yDim - 3.6);
                    ctx.lineTo(x, yDim + 3.6);
                    ctx.closePath();
                    ctx.fill();
                });
                ctx.font = '700 14px "JetBrains Mono", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const tw = ctx.measureText(label).width + 16;
                const xm = (x1 + x2) / 2;
                ctx.fillStyle = '#000223';
                ctx.fillRect(xm - tw / 2, yDim - 11, tw, 22);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 1;
                ctx.strokeRect(xm - tw / 2, yDim - 11, tw, 22);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(label, xm, yDim + 0.5);
                ctx.restore();
            }

                const isoTemporaryMaterials = new Map();
                const isoNormalGeometries = new Set();

                // A câmera az=-0.47 está do lado X_RIGHT (DIST): ocultar essa parede e
                // as malas 1 e 3, preservando as duas malas da fileira oposta (0 e 2).
                const isoNearBagIndices = [1, 3];
                const isoRearBagIndices = [0, 2];

                const hideForIsometric = object => {
                    if (!isoVisibilityStates.has(object)) isoVisibilityStates.set(object, object.visible);
                    object.visible = false;
                };
                const swapIsoMaterial = (mesh, temporary) => {
                    isoMaterialSwaps.push([mesh, mesh.material, mesh.renderOrder]);
                    mesh.material = temporary;
                    mesh.renderOrder = 0;  // oclusão apenas pelo depth buffer, nunca sobrepor as malas
                };
                const resetIsometricAppearance = () => {
                    isoMaterialSwaps.forEach(([mesh, material, renderOrder]) => {
                        mesh.material = material;
                        mesh.renderOrder = renderOrder;
                    });
                    isoMaterialSwaps.length = 0;
                    isoVisibilityStates.forEach((visible, object) => { object.visible = visible; });
                    isoVisibilityStates.clear();
                    isoNormalGeometries.forEach(geometry => geometry.deleteAttribute('normal'));
                    isoNormalGeometries.clear();
                    isoTemporaryMaterials.forEach(material => material.dispose());
                    isoTemporaryMaterials.clear();
                };
                const highlightIsometricInterior = () => {
                    // Cores foscas/acetinadas, diferenciadas pelo sombreamento real das luzes
                    // ambiente e direcionais já presentes. Não mudar os materiais originais.
                    const wallColors = new Map([
                        [mat, 0xbecddd],       // parede lateral distante
                        [wm, 0x9fb5c9],        // parede inclinada e divisória superior
                        [fm, 0x849eb8],        // piso escalonado
                        [doorMat, 0xc5d4e3],   // porta/teto retrátil
                        [handleMat, 0x899fb4] // puxador da porta
                    ]);
                    profileBandMaterials.forEach(material => wallColors.set(material, 0x99b0c3));
                    const solidMaterialFor = (source, isBag) => {
                        if (!isoTemporaryMaterials.has(source)) {
                            const solid = isBag
                                ? source.clone()
                                : new THREE.MeshStandardMaterial({
                                    color: wallColors.get(source) ?? source.color.getHex(),
                                    side: THREE.DoubleSide,
                                    roughness: 0.78, metalness: 0.03,
                                    polygonOffset: !!source.polygonOffset,
                                    polygonOffsetFactor: source.polygonOffsetFactor || 0,
                                    polygonOffsetUnits: source.polygonOffsetUnits || 0
                                });
                            solid.opacity = 1.0;
                            solid.transparent = false;
                            solid.depthWrite = true;
                            solid.depthTest = true;
                            solid.wireframe = false;
                            solid.needsUpdate = true;
                            isoTemporaryMaterials.set(source, solid);
                        }
                        return isoTemporaryMaterials.get(source);
                    };

                    // Retira toda a lateral X_RIGHT, inclusive suas tiras de extrusão.
                    // Retira também TODAS as linhas estruturais do bin, inclusive EdgesGeometry,
                    // guias e divisões das ripas: nenhuma linha pode atravessar as malas.
                    sideWallParts.forEach(hideForIsometric);
                    group.traverse(object => {
                        if (object.isLine || object.isLineSegments || object.isLineLoop) {
                            hideForIsometric(object);
                        }
                        if (!object.isMesh) return;
                        // Paredes planas construídas com BufferGeometry precisam de normais
                        // para receber sombreamento físico; remover as normais temporárias no reset.
                        if (object.geometry && !object.geometry.getAttribute('normal') &&
                            object.geometry.getAttribute('position')) {
                            object.geometry.computeVertexNormals();
                            isoNormalGeometries.add(object.geometry);
                        }
                        swapIsoMaterial(object, solidMaterialFor(object.material, false));
                    });

                    // As duas malas do fundo (casco, rodinhas e alças) ficam integralmente
                    // opacas. As linhas decorativas das próprias malas continuam visíveis.
                    isoRearBagIndices.forEach(index => {
                        const bag = bags[index];
                        bag.root.visible = true;
                        if (bag.env) bag.env.visible = false;
                        bag.root.traverse(object => {
                            if (object.isMesh) {
                                swapIsoMaterial(object, solidMaterialFor(object.material, true));
                            }
                        });
                    });
                };
                const exportShot = (name, angle, elevation, radius) => {
                    az = angle; el = elevation; R = radius;
                    updateDoor(0.84);
                    upd();
                    const a = document.createElement('a');
                    a.href = cv.toDataURL('image/png');
                    a.download = 'alpha_bin_' + name + '_acrylic_4k.png';
                    document.body.appendChild(a); a.click(); a.remove();
                };
                const restore = () => {
                    resetIsometricAppearance();
                    state.bagData.forEach((b, i) => {
                        bags[i].root.visible = b.vis;
                        bags[i].root.position.copy(b.pos);
                        bags[i].root.quaternion.copy(b.quat);
                        if (bags[i].env) bags[i].env.visible = b.env;
                    });
                    state.surfaces.forEach(([m, tr, op, dw, color]) => {
                        m.color.setHex(color);
                        m.transparent = tr; m.opacity = op; m.depthWrite = dw; m.needsUpdate = true;
                    });
                    ren.setClearColor(state.clear, state.clearAlpha);
                    ren.setPixelRatio(state.pixelRatio);
                    ren.setSize(state.size.x, state.size.y, false);
                    az = state.az; el = state.el; R = state.R; T.copy(state.T);
                    updateDoor(state.door);
                    syncDoorUI();
                    rs();
                    exporting = false;
                };
                try {
                    bags.forEach((b, i) => {
                        b.root.visible = true;
                        if (b.env) b.env.visible = false;
                        setBagPoseAlongPath(i, 1);
                    });
                    state.surfaces.forEach(([m], i) => {
                        m.transparent = true;
                        m.opacity = i === 2 ? 0.37 : (i < 2 ? 0.23 : 0.25);
                        m.depthWrite = false;
                        m.needsUpdate = true;
                    });
                    ren.setPixelRatio(1); ren.setSize(EW, EH, false);
                    cam.aspect = EW / EH; cam.updateProjectionMatrix();
                    ren.setClearColor(0x000000, 0);
                    exportShot('lateral_with_four_bags', 0, 0.08, 2600); // primeira imagem SEM alterações
                    setTimeout(() => {
                        try {
                            // A câmera vê X_RIGHT: ocultar as malas 1 e 3 somente neste PNG.
                            isoNearBagIndices.forEach(i => { bags[i].root.visible = false; });
                            highlightIsometricInterior();
                            exportShot('side_isometric_with_two_rear_bags', -0.47, 0.17, 2650);
                        } catch (err) {
                            console.warn('Side isometric export:', err);
                        } finally {
                            // Revela novamente a fileira frontal após o PNG (também em erro);
                            // restore() recupera, por fim, a visibilidade original da tela.
                            isoNearBagIndices.forEach(i => { bags[i].root.visible = true; });
                            restore(); // devolve imediatamente materiais, contornos e pose
                        }
                    }, 400);
                } catch (err) {
                    console.warn('Side transparent export:', err);
                    restore();
                }
            };

            setTimeout(rs, 60);
        })();

    // Exporta os dois bins da aba 2 (Alpha + Convencional, com as malas) num único PNG de fundo transparente, sem as cotas.
    window.exportBinsPNG = function (K, which) {   // which: 'alpha' | 'conv' | undefined (os dois)
        K = K || 2.5;   // fator de ampliação em relação ao tamanho na tela
        const boxA = document.getElementById('nova-container'), boxC = document.getElementById('conv-top-container');
        if (!boxC || !window.__convDraw) return;
        if (which === 'alpha' && !window.__novaRender) { alert('Alpha bin is not loaded yet (open this tab with internet so three.js loads).'); return; }
        const saved = [boxA, boxC].map(b => b ? [b, b.style.width, b.style.height] : null).filter(Boolean);
        const grab = c => { const t = document.createElement('canvas'); t.width = c.width; t.height = c.height; t.getContext('2d').drawImage(c, 0, 0); return t; };
        let cA = null, cC = null;
        try {
            saved.forEach(([b]) => { const r = b.getBoundingClientRect(); b.style.width = Math.round(r.width * K) + 'px'; b.style.height = Math.round(r.height * K) + 'px'; });
            window.__novaNoDim = true; window.__convNoDim = true; window.__novaK = K;
            if (which !== 'conv' && boxA && window.__novaRender) { const c = window.__novaRender(); if (c) cA = grab(c); }
            if (which !== 'alpha') { window.__convDraw(); cC = grab(window.__convCapture ? window.__convCapture() : document.getElementById('convTopCanvas')); }
        } finally {
            saved.forEach(([b, w, h]) => { b.style.width = w; b.style.height = h; });
            window.__novaNoDim = false; window.__convNoDim = false; window.__novaK = 1;
            try { if (window.__novaRender) window.__novaRender(); window.__convDraw(); } catch (e) { }
        }
        const bbox = c => {
            const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
            for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
            return x1 < 0 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
        };
        const parts = [cA, cC].filter(Boolean).map(c => ({ c, b: bbox(c) })).filter(p => p.b);
        if (!parts.length) return;
        const pad = 12, gap = 80;
        const top = Math.min(...parts.map(p => p.b.y0)), bot = Math.max(...parts.map(p => p.b.y1));   // mesma altura/alinhamento vertical da tela
        const W = parts.reduce((a, p) => a + (p.b.x1 - p.b.x0), 0) + gap * (parts.length - 1) + 2 * pad, H = bot - top + 2 * pad;
        const out = document.createElement('canvas'); out.width = W; out.height = H;
        const o = out.getContext('2d'); let x = pad;
        parts.forEach(p => { const w = p.b.x1 - p.b.x0; o.drawImage(p.c, p.b.x0, top, w, bot - top, x, pad, w, bot - top); x += w + gap; });
        out.toBlob(blob => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = which === 'alpha' ? 'bin_alpha_sem_fundo.png' : which === 'conv' ? 'bin_convencional_sem_fundo.png' : 'bins_alpha_convencional_sem_fundo.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, 'image/png');
    };

                        ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(xa, yDim); ctx.lineTo(xe, yDim); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(xa, yDim); ctx.lineTo(xa + aL, yDim - aH); ctx.lineTo(xa + aL, yDim + aH); ctx.closePath(); ctx.fill();

    <script>
    // -------------------------------------------------------------------------
    // ENCERRAMENTO (30 s): 3 cenas com linha do tempo própria em CSS (.go): cena 1 de 0 a 10 s, cena 2 de 10 a 20 s,
    // cena 3 (com a logo) de 20 a 30 s. Os palcos são 1920x1080 e escalam pelo tamanho do #closing-root
    // (clientWidth/clientHeight do container da aba ou do quadro da Simulação Geral), não pela janela.
    // -------------------------------------------------------------------------
    (function closingAnimation() {
        const root = document.getElementById('closing-root'); if (!root) return;
        const scenes = ['scene-1', 'scene-2', 'scene-3'].map(id => document.getElementById(id));
        const stages = ['s1-stage', 's2-stage', 's3-stage'].map(id => document.getElementById(id)).filter(Boolean);
        const timeEl = document.getElementById('closing-time');
        const DURATION = 30000;
        let t0 = 0, raf = 0;
        function fit() {
            const W = root.clientWidth, H = root.clientHeight; if (!W || !H) return;
            const s = Math.min(W / 1920, H / 1080);
            const tf = `translate(${((W - 1920 * s) / 2).toFixed(2)}px,${((H - 1080 * s) / 2).toFixed(2)}px) scale(${s.toFixed(5)})`;
            stages.forEach(e => { e.style.transform = tf; });
        }
        if (window.ResizeObserver) new ResizeObserver(fit).observe(root);
        window.addEventListener('resize', fit);
        const label = ms => { if (timeEl) timeEl.textContent = `${(Math.min(ms, DURATION) / 1000).toFixed(1).padStart(4, '0')} / 30.0 s`; };
        function tick() {
            cancelAnimationFrame(raf);
            if (!t0) return;
            const el = performance.now() - t0; label(el);
            if (el < DURATION) raf = requestAnimationFrame(tick);
        }
        function reset() {
            cancelAnimationFrame(raf); t0 = 0;
            scenes.forEach(e => e && e.classList.remove('go'));
            fit(); label(0);
        }
        function play() {
            reset();
            void root.offsetWidth;                                   // reinicia as animações CSS do zero
            scenes.forEach(e => e && e.classList.add('go'));
            t0 = performance.now(); tick();
        }
        // fontes Montserrat 500/800 embutidas: decodifica já no carregamento, para a 1ª cena não trocar de fonte no meio
        try { ['500 40px Montserrat', '800 40px Montserrat'].forEach(f => document.fonts.load(f)); } catch (e) {}
        const btn = document.getElementById('closing-play'); if (btn) btn.addEventListener('click', play);
        window.closingFit = fit;
        window.closingReset = reset;
        window.closingPlay = play;
        window.closingEnter = () => { fit(); play(); };
        window.closingDone = () => t0 > 0 && performance.now() - t0 >= DURATION;   // terminou a revelação da logo (30 s)
    })();
    </script>

                    chosenMime = m;
                    break;
                } catch (e) {}
            }
            if (!mr) {
                try { mr = new MediaRecorder(recStream); chosenMime = mr.mimeType || 'video/webm'; }
                catch (e) {
                    clearInterval(timer); recVideo.remove();
                    stream.getTracks().forEach(t => t.stop());
                    document.body.classList.remove('rec-clean');
                    stage.classList.remove('rec'); abort();
                    alert('This browser could not initialize the video recorder.');
                    return;
                }
            }

            const chunks = [];
            mr.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            mr.onerror = e => { console.error('MediaRecorder error:', e); stopRec(); };
            mr.onstop = () => {
                clearInterval(timer);
                recVideo.srcObject = null;
                recVideo.remove();
                stream.getTracks().forEach(t => t.stop());
                document.body.classList.remove('rec-clean');
                document.body.style.removeProperty('--rec-w');
                stage.classList.remove('rec');
                recBtn.classList.remove('on');
                recBtn.textContent = '⏺ Export video (MP4)';
                rec = null;
                if (!chunks.length) {
                    alert('No frames were captured. Make sure to keep the window visible during recording.');
                    return;
                }
                const ext = chosenMime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
                const blob = new Blob(chunks, { type: chosenMime.split(';')[0] || 'video/' + ext });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'simulacao-completa-bin-alpha.' + ext;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 15000);
            };
            track.addEventListener('ended', () => { stopRec(); abort(); });
            rec = { mr, timer };
            mr.start(500);
            recBtn.classList.add('on');
            recBtn.textContent = '■ Stop and save video';
        }
        recBtn.addEventListener('click', startRec);

        // ---- exportar PNGs do COMEÇO e do FINAL de cada aba: mesma captura/recorte do vídeo, quadros 1920x1080 num único ZIP ----
        const snapBtn = $('tour-snap');
        let snap = null;
        const snapLabel = () => '■ Stop and save PNGs (' + (snap ? snap.frames.length : 0) + ')';

        // ZIP mínimo (método "store", sem compressão — PNG já é comprimido)
        const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
        const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
        function buildZip(files) {          // files: [{ name, data:Uint8Array }]
            const enc = new TextEncoder(), parts = [], central = [];
            const d = new Date();
            const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
            const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
            let offset = 0;
            files.forEach(f => {
                const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
                const lh = new DataView(new ArrayBuffer(30));
                lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
                lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
                lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
                parts.push(lh.buffer, nm, f.data);
                const ch = new DataView(new ArrayBuffer(46));
                ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
                ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
                ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nm.length, true);
                ch.setUint32(42, offset, true);
                central.push(ch.buffer, nm);
                offset += 30 + nm.length + sz;
            });
            const cdSize = central.reduce((a, b) => a + (b.byteLength !== undefined ? b.byteLength : b.length), 0);
            const end = new DataView(new ArrayBuffer(22));
            end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
            end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
            return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
        }
        const pad = (n, w) => String(n).padStart(w, '0');

        async function snapFinish() {
            if (!snap || snap.finishing) return;
            const sn = snap; sn.finishing = true;
            await Promise.all(sn.pending);
            sn.video.srcObject = null; sn.video.remove();
            sn.stream.getTracks().forEach(t => t.stop());
            document.body.classList.remove('rec-clean');
            document.body.style.removeProperty('--rec-w');
            stage.classList.remove('rec');
            snapBtn.classList.remove('on'); snapBtn.textContent = '📷 Export start/end PNGs';
            recBtn.disabled = false;
            snap = null;
            if (!sn.frames.length) { alert('No frames were captured. Keep the window visible while the simulation runs.'); return; }
            const files = [];
            for (const f of sn.frames) files.push({ name: f.name, data: new Uint8Array(await f.blob.arrayBuffer()) });
            const url = URL.createObjectURL(buildZip(files));
            const a = document.createElement('a');
            a.href = url; a.download = 'simulacao-completa-bin-alpha-frames-png.zip';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 30000);
        }

        function snapTake(name) {
            if (!snap || snap.finishing) return;
            const v = snap.video, vw = v.videoWidth, vh = v.videoHeight;
            if (!vw || !vh) return;
            const OW = 1920, OH = 1080, c = snap.canvas, g = snap.ctx;
            g.fillStyle = '#000223'; g.fillRect(0, 0, OW, OH);
            let sx = 0, sy = 0, sw = vw, sh = vh;
            if (!snap.cropped && snap.surf === 'browser' && window.innerWidth > 0 && window.innerHeight > 0) {
                const r = stage.getBoundingClientRect();
                if (r.width > 50 && r.height > 50) {
                    const kx = vw / window.innerWidth, ky = vh / window.innerHeight;
                    sx = Math.max(0, Math.round(r.left * kx)); sy = Math.max(0, Math.round(r.top * ky));
                    sw = Math.min(vw - sx, Math.round(r.width * kx)); sh = Math.min(vh - sy, Math.round(r.height * ky));
                }
            }
            const k = Math.min(OW / sw, OH / sh), dw = Math.round(sw * k), dh = Math.round(sh * k);
            g.drawImage(v, sx, sy, sw, sh, Math.round((OW - dw) / 2), Math.round((OH - dh) / 2), dw, dh);
            const sn = snap;
            const pr = new Promise(res => c.toBlob(b => { if (b) sn.frames.push({ name, blob: b }); snapBtn.textContent = snapLabel(); res(); }, 'image/png'));
            sn.pending.push(pr);
            pr.then(() => { sn.pending = sn.pending.filter(x => x !== pr); });
        }

        async function startSnap() {
            if (snap) { await snapFinish(); abort(); return; }
            if (rec) { alert('Stop the video recording first.'); return; }
            if (!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) {
                alert('PNG export requires the Google Chrome or Microsoft Edge browser (open the HTML file directly in the browser).');
                return;
            }
            let stream;
            try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: { ideal: 30, max: 60 }, width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 16 / 9 } },
                    audio: false, preferCurrentTab: true, selfBrowserSurface: 'include', surfaceSwitching: 'include'
                });
            } catch (e) {
                if (e && e.name !== 'NotAllowedError' && e.name !== 'AbortError') alert('Could not start screen capture (' + (e.message || e.name) + '). Open the HTML file directly in a Chrome or Edge tab.');
                return;
            }
            const track = stream.getVideoTracks()[0];
            if (!track) { stream.getTracks().forEach(t => t.stop()); return; }

            document.body.classList.add('rec-clean');
            const fitW = Math.min(window.innerWidth, window.innerHeight * 16 / 9, 1920);
            const recW = Math.max(640, Math.floor(fitW / 32) * 32), recH = recW * 9 / 16;
            fitFrame(false);
            stage.style.setProperty('--rec-w', recW + 'px'); stage.style.setProperty('--rec-h', recH + 'px');
            document.body.style.setProperty('--rec-w', recW + 'px');
            stage.classList.add('rec');
            recBtn.disabled = true;
            run(0);
            await sleep(250);

            let cropped = false;
            if (window.CropTarget && typeof track.cropTo === 'function') {
                try { await track.cropTo(await CropTarget.fromElement(stage)); cropped = true; } catch (e) { console.warn('cropTo unavailable; using manual crop:', e); }
            }
            const video = document.createElement('video');
            video.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1;';
            video.muted = true; video.playsInline = true; video.srcObject = stream;
            document.body.appendChild(video);
            try { await video.play(); } catch (e) {}
            for (let w = 0; w < 20 && !video.videoWidth; w++) await sleep(50);

            const canvas = document.createElement('canvas'); canvas.width = 1920; canvas.height = 1080;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
            const surf = (track.getSettings && track.getSettings().displaySurface) || '';

            snap = { stream, video, canvas, ctx, cropped, surf, frames: [], pending: [], finishing: false };
            track.addEventListener('ended', () => { snapFinish().then(() => abort()); });
            snapBtn.classList.add('on'); snapBtn.textContent = snapLabel();
        }
        snapBtn.addEventListener('click', startSnap);
        window.__tourEdge = (i, st, when) => { if (snap) snapTake(pad(i + 1, 2) + '_' + st.key + '_' + when + '.png'); };

        // integra com o fim/parada da sequência (o handler do vídeo só age quando há gravação de vídeo)
        const prevTourEnded = window.__tourEnded, prevStopRec = window.__stopTourRec;
        window.__tourEnded = async () => {
            if (snap) { await sleep(150); await snapFinish(); return; }   // gera o ZIP
            return prevTourEnded();
        };
        window.__stopTourRec = () => { if (snap) { snapFinish().then(() => abort()); return; } prevStopRec(); };

        window.tourStart = () => run(0);        // chamado ao clicar na aba 8
        window.tourAbort = abort;               // chamado ao sair da aba 8
    })();

    </script>

<script>
/* Tab 5 independent door movement leaves the timeline and Tab 6 unaffected. */
(function () {
    window.__uniRefDoorProgress = 0;
    let doorRaf = 0;
    window.uniRefSetDoors = value => {
        if (doorRaf) { cancelAnimationFrame(doorRaf); doorRaf = 0; }
        window.__uniRefDoorProgress = Math.max(0,Math.min(1, Number(value)||0));
        const slider=document.getElementById('uni-bin-door-slider');
        const pct=document.getElementById('uni-bin-door-pct');
        const button=document.getElementById('uni-bin-door-toggle');
        if(slider) slider.value = String(Math.round(window.__uniRefDoorProgress*100));
        if(pct) pct.textContent = Math.round(window.__uniRefDoorProgress*100)+'%';
        if(button) button.textContent = window.__uniRefDoorProgress>.5 ? 'Close bin doors' : 'Open bin doors';
        if(typeof window.uniRefresh === 'function') window.uniRefresh();
    };
    window.uniRefToggleDoors = () => {
        if (doorRaf) cancelAnimationFrame(doorRaf);
        const from = window.__uniRefDoorProgress || 0, target=from>.5?0:1;
        const t0=performance.now(), duration=950;
        function tick(now) {
            const x=Math.min(1,(now-t0)/duration), eased=x*x*(3-2*x);
            doorRaf=0;
            window.uniRefSetDoors(from+(target-from)*eased);
            if(x<1) doorRaf=requestAnimationFrame(tick);
        }
        doorRaf=requestAnimationFrame(tick);
    };
})();
</script>
