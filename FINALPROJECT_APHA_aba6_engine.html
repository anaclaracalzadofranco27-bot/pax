                `L ${p4.x.toFixed(2)} ${(-p4.y).toFixed(2)}`,
                `Q ${tR.x.toFixed(2)} ${(-tR.y).toFixed(2)} ${p5.x.toFixed(2)} ${(-p5.y).toFixed(2)}`,
                `L ${p6.x.toFixed(2)} ${(-p6.y).toFixed(2)}`,
                `Q ${tL.x.toFixed(2)} ${(-tL.y).toFixed(2)} ${p7.x.toFixed(2)} ${(-p7.y).toFixed(2)}`,
                `L ${p8.x.toFixed(2)} ${(-p8.y).toFixed(2)}`,
                `Q ${bL.x.toFixed(2)} ${(-bL.y).toFixed(2)} ${p1.x.toFixed(2)} ${(-p1.y).toFixed(2)}`,
                `Z`
            ].join(' ');
        }

        function computeLeftBinAtY(baseY) {
            const wallX = -getFuselageX(baseY);
            const wallFix = { x: wallX, y: baseY };

            const tiltDeg = SUITCASE.fixedTiltDeg; // 15.0°
            const alphaRad = tiltDeg * Math.PI / 180.0;
            const tx = Math.cos(alphaRad);
            const ty = Math.sin(alphaRad);
            const nx = -Math.sin(alphaRad);
            const ny = Math.cos(alphaRad);

            // =========================================================================
            // 1. POSICIONAMENTO DA MALA COM:
            //    - Altura mínima da base do bin para a mala = 1,0" (2,54 mm)
            //    - Folga operacional exata da fuselagem = 1,0" (2,54 mm)
            // =========================================================================
            const targetRadius = CABIN_R - SUITCASE.operationalClearMm; // 137.00 - 2.54 = 134.46 mm
            const bagBotLeftY = baseY + SUITCASE.minBinToBagHeightMm;   // Exatamente 1,0" (2,54 mm) acima da base Y do bin
            const bagTopLeftY = bagBotLeftY + SUITCASE.hMm * ny;

            // Para que o canto superior esquerdo (`bagSeatedTopLeft`) e o canto inferior esquerdo (`seatedBagBotLeft`)
            // respeitem exatamente 1,0" (2,54 mm) de distância radial até a circunferência da fuselagem:
            const maxAllowTopLeftX = -Math.sqrt(Math.max(0, targetRadius * targetRadius - Math.pow(bagTopLeftY - CABIN_YC, 2)));
            const maxAllowBotLeftX = -Math.sqrt(Math.max(0, targetRadius * targetRadius - Math.pow(bagBotLeftY - CABIN_YC, 2)));

            const seatedBagBotLeftX = Math.max(
                maxAllowBotLeftX,
                maxAllowTopLeftX - SUITCASE.hMm * nx
            );

            const seatedBagBotLeft = {
                x: seatedBagBotLeftX,
                y: bagBotLeftY
            };
            const seatedBagBotRight = {
                x: seatedBagBotLeft.x + SUITCASE.wMm * tx,
                y: seatedBagBotLeft.y + SUITCASE.wMm * ty
            };
            const bagSeatedTopLeft = {
                x: seatedBagBotLeft.x + SUITCASE.hMm * nx,
                y: seatedBagBotLeft.y + SUITCASE.hMm * ny
            };
            const seatedBagTopRight = {
                x: seatedBagBotRight.x + SUITCASE.hMm * nx,
                y: seatedBagBotRight.y + SUITCASE.hMm * ny
            };

            const rTopLeftActual = Math.hypot(bagSeatedTopLeft.x, bagSeatedTopLeft.y - CABIN_YC);
            const rBotLeftActual = Math.hypot(seatedBagBotLeft.x, seatedBagBotLeft.y - CABIN_YC);
            const bagWallClearanceMm = CABIN_R - Math.max(rTopLeftActual, rBotLeftActual);
            const bagBaseClearanceMm = seatedBagBotLeft.y - baseY; // Exatos 2,54 mm (1,0")

            // Posição animada da mala (conforme slider de inserção 0% a 100%)
            const slideOutDist = (1.0 - state.bagInsertPct / 100.0) * 30.0;
            const bagBotLeft = {
                x: seatedBagBotLeft.x + slideOutDist * tx,
                y: seatedBagBotLeft.y + slideOutDist * ty
            };
            const bagBotRight = {
                x: seatedBagBotRight.x + slideOutDist * tx,
                y: seatedBagBotRight.y + slideOutDist * ty
            };
            const bagTopLeft = {
                x: bagSeatedTopLeft.x + slideOutDist * tx,
                y: bagSeatedTopLeft.y + slideOutDist * ty
            };
            const bagTopRight = {
                x: seatedBagTopRight.x + slideOutDist * tx,
                y: seatedBagTopRight.y + slideOutDist * ty
            };

            const roundedBagPathD = buildRoundedRectPath(
                bagBotLeft, bagBotRight, bagTopRight, bagTopLeft,
                tx, ty, nx, ny, 0.85
            );

            // =========================================================================
            // 2. CAVIDADE INTERNA DO BIN AO REDOR DA MALA:
            // =========================================================================
            const padBack = 0.65;
            const padFloor = 0.55;
            const padRoof = 0.65;
            const padFront = 0.25;

            const boxBotLeft = {
                x: seatedBagBotLeft.x - padBack * tx - padFloor * nx,
                y: seatedBagBotLeft.y - padBack * ty - padFloor * ny
            };
            const boxBotRight = {
                x: seatedBagBotRight.x + padFront * tx - padFloor * nx,
                y: seatedBagBotRight.y + padFront * ty - padFloor * ny
            };
            const boxTopLeft = {
                x: bagSeatedTopLeft.x - padBack * tx + padRoof * nx,
                y: bagSeatedTopLeft.y - padBack * ty + padRoof * ny
            };
            const boxTopRight = {
                x: seatedBagTopRight.x + padFront * tx + padRoof * nx,
                y: seatedBagTopRight.y + padFront * ty + padRoof * ny
            };

            const roundedChamberPathD = buildRoundedRectPath(
                boxBotLeft, boxBotRight, boxTopRight, boxTopLeft,
                tx, ty, nx, ny, 1.15
            );

            // =========================================================================
            // 3. PORTA ARREDONDADA AO MÁXIMO POSSÍVEL COM AVANÇO HORIZONTAL MÁXIMO DE 0,5" (1,27 mm)
            //    E BARRIGA INFERIOR DO BIN REDUZIDA PARA 1,0" (2,54 mm) DA MALA:            const latchDropBelowBagMm = DOOR_KINEMATIC_DELTA.inchMm; // 2.54 mm (1")

            const doorTipInner = {
                x: seatedBagBotRight.x + 0.05 * tx - latchDropBelowBagMm * (-nx),
                y: seatedBagBotRight.y - latchDropBelowBagMm
            };
            const doorTipOuter = {
                x: doorTipInner.x + 1.35,
                y: doorTipInner.y + 0.08
            };

            const doorLipBot = {
                x: doorTipInner.x - 0.15,
                y: doorTipInner.y - 0.05
            };
            const mouthStepIn = {
                x: seatedBagBotRight.x + 0.05,
                y: seatedBagBotRight.y - 0.25
            };

            // Bring the kinematic carriage towards the front lip: the oval door
            // now rocks around a point closer to its edge rather than
            // tilting far backwards around the rear of the bin.
            const pvt = {
                x: seatedBagTopRight.x - 5.65,
                y: seatedBagTopRight.y + 4.00
            };
            // Retraction along the upper guide counters the outward
            // swing; the articulated rod is constructed on the door below.
            const carriageTravel = { x: -13.00, y: -3.80 };
            const CONVENTIONAL_DOOR_OPEN_DEG = 74.0;

            // No vertical lip/step: the front door meets the continuous
            // upper fuselage arc at this CAD-derived point.
            // Preserve the roof seam in the exact same fuselage location even
            // though the moving carriage has been relocated forwards.
            const roofJoinX = seatedBagTopRight.x - 21.85;
            const fuseTop = {
                x: roofJoinX,
                y: CABIN_YC + Math.sqrt(Math.max(0, CABIN_R * CABIN_R - roofJoinX * roofJoinX))
            };
            // Retained as metadata for the existing elevation calculation.
            const rampTopEnd = { x: fuseTop.x, y: fuseTop.y };

            // Extended, continuous shell-to-lip door: upper outer tip exactly
            // touches the fuselage; inner face follows the curved panel.
            const bladeTopOuter = { x: fuseTop.x, y: fuseTop.y };
            const bladeTopInner = { x: fuseTop.x + 0.90, y: fuseTop.y - 1.10 };

            // Keep the old design target for CAD metadata; the actual opening
            // envelope is now solved from the complete moving quadratic surface.
            const maxBulgeX = SUITCASE.maxDoorBulgeXMm;
            const targetMaxDoorX = doorTipOuter.x + maxBulgeX;

            // The shell seam will share the final door inner Bézier control,
            // so the closed door joins the bottom lip without a visible step.
            const mouthCurveCtrl = {
                x: doorTipOuter.x + 1.00,
                y: (bladeTopInner.y + doorTipInner.y) * 0.5 + 1.00
            };

                        // Barriga inferior enxuta: sai de psuBotCorner (1,0" abaixo do canto inferior esquerdo da mala)
            // e sobe suavemente mantendo a espessura mínima de 1,0" (2,54 mm) abaixo da mala até doorLipBot
            const psuBotCorner = {
                x: seatedBagBotLeft.x,
                y: baseY
            };
            const bellyCtrl = {
                x: (psuBotCorner.x + doorLipBot.x) * 0.5 + 1.2,
                y: (psuBotCorner.y + doorLipBot.y) * 0.5 - 0.35
            };

            const hornPeakY = Math.min(CABIN_YC + CABIN_R - 2.0, boxTopLeft.y + 5.2);
            const hornPeak = { x: -getFuselageX(hornPeakY), y: hornPeakY };
            const notchValley = {
                x: boxTopLeft.x + 2.2 * tx + 0.35 * nx,
                y: boxTopLeft.y + 2.2 * ty + 0.35 * ny
            };
            const notchCtrl = {
                x: (hornPeak.x + notchValley.x) * 0.5 - 0.8,
                y: (hornPeak.y + notchValley.y) * 0.5 - 0.8
            };

            const lugTopLeft = {
                x: pvt.x - 2.4 * tx + 0.3 * nx,
                y: pvt.y - 2.4 * ty + 0.3 * ny
            };
            const lugBotRight = {
                x: pvt.x + 0.8 * tx - 1.15 * nx,
                y: pvt.y + 0.8 * ty - 1.15 * ny
            };

            const brkHubLeft = {
                x: pvt.x - 0.60 * tx + 0.65 * nx,
                y: pvt.y - 0.60 * ty + 0.65 * ny
            };
            const brkHubBot = {
                x: pvt.x - 0.20 * tx - 0.80 * nx,
                y: pvt.y - 0.20 * ty - 0.80 * ny
            };
            const brkJoinTop = {
                x: bladeTopInner.x + 0.08 * tx - 0.05 * nx,
                y: bladeTopInner.y + 0.08 * ty - 0.05 * ny
            };
            const brkJoinBot = {
                x: seatedBagTopRight.x + 1.45,
                y: seatedBagTopRight.y - 2.00
            };
            const bladeMidInner = {
                x: brkJoinBot.x,
                y: brkJoinBot.y
            };

            // Door shaped after the yellow CAD sketch: a nearly horizontal
            // shoulder at the roof, a broad oval transition, then an
            // almost vertical front at the lower lip. Both skins follow
            // the same curve model, preserving the panel thickness.
            const doorOuterCtrl = {
                x: doorTipOuter.x + 2.65,
                y: (bladeTopOuter.y + doorTipOuter.y) * 0.5 + 1.55
            };
            const doorInnerCtrl = {
                x: doorOuterCtrl.x - 1.65,
                y: doorOuterCtrl.y - 0.75
            };
            mouthCurveCtrl.x = doorInnerCtrl.x;
            mouthCurveCtrl.y = doorInnerCtrl.y;

            // A single, asymmetric cubic provides a flatter top tangent
            // and an upright nose. Subdivide it at t=.5 so the existing
            // seven-point silhouette, swept envelope and export paths
            // continue to sample exactly the same rigid oval door.
            function makeFrontOvalProfile(top, tip) {
                const dx = tip.x - top.x;
                const drop = top.y - tip.y;
                const p1 = {
                    x: top.x + 0.34 * dx,
                    y: top.y + 0.045 * drop
                };
                const p2 = {
                    x: tip.x + 0.035 * dx,
                    y: tip.y + 0.53 * drop
                };
                const half = (a, b) => ({
                    x: (a.x + b.x) * 0.5,
                    y: (a.y + b.y) * 0.5
                });
                const a = half(top, p1), b = half(p1, p2), c = half(p2, tip);
                const d = half(a, b), e = half(b, c), crown = half(d, e);
                // Adjacent cubic pieces are C1-continuous at the crown.
                return [top, a, d, crown, e, c, tip];
            }
            const ovalOuter = makeFrontOvalProfile(bladeTopOuter, doorTipOuter);
            const ovalInner = makeFrontOvalProfile(bladeTopInner, doorTipInner);

            // Two revolute joints: a pin on the curved guide and a mounting
            // pin rigidly attached to the *actual oval door*, SVG-style.
            // The rod length stays constant; its angle is independent of
            // the door's angle so it can articulate freely while following it.
            const cubicPoint = (a, b, c, d, t) => {
                const v = 1 - t;
                return { x: v*v*v*a.x + 3*v*v*t*b.x + 3*v*t*t*c.x + t*t*t*d.x,
                         y: v*v*v*a.y + 3*v*v*t*b.y + 3*v*t*t*c.y + t*t*t*d.y };
            };
            // Mount the link on the *front half* of the inner door skin,
            // rather than behind its upper shoulder. Its guide pin sits
            // almost directly below the mount: nearly vertical at rest.
            const leverMountLocal = cubicPoint(
                ovalInner[3], ovalInner[4], ovalInner[5], ovalInner[6], 0.24);
            const leverPinClosed = {
                x: leverMountLocal.x - 0.70,
                y: leverMountLocal.y - 11.00
            };
            const leverDx = leverMountLocal.x - leverPinClosed.x;
            const leverDy = leverMountLocal.y - leverPinClosed.y;
            const leverLength = Math.hypot(leverDx, leverDy);
            const leverStartAngle = Math.atan2(leverDy, leverDx);

            const latchTopOuter = {
                x: doorTipOuter.x + 0.25,
                y: doorTipOuter.y + 2.65
            };
            const latchTopInner = {
                x: doorTipInner.x + 0.25,
                y: doorTipInner.y + 2.55
            };
            const latchHookIn = {
                x: doorTipInner.x - 0.55 * tx + 0.55 * nx,
                y: doorTipInner.y - 0.55 * ty + 0.55 * ny
            };

            function getDoorAtAngle(angDeg) {
                // The door retains one rigid oval blade. Its carriage travels
                // smoothly while a distinct hinged rod drives the visible pin
                // along a curved locus (rather than welding it to the blade).
                const u = Math.min(1, Math.max(0, angDeg / CONVENTIONAL_DOOR_OPEN_DEG));
                const slideU = u*u*(3 - 2*u);
                const carrier = {
                    x: pvt.x + carriageTravel.x * slideU,
                    y: pvt.y + carriageTravel.y * slideU
                };
                const move = (pt) => {
                    const rotated = rotatePointAroundPivot(pt, pvt, angDeg);
                    return { x: rotated.x + carrier.x - pvt.x,
                             y: rotated.y + carrier.y - pvt.y };
                };
                // Both spherical/revolute joints are evaluated every frame;
                // the pin trajectory is solved from the arm's exact length.
                const leverMount = move(leverMountLocal);
                const leverAngle = leverStartAngle
                    + (angDeg * Math.PI / 180) * 0.15;
                const pin = {
                    x: leverMount.x - leverLength * Math.cos(leverAngle),
                    y: leverMount.y - leverLength * Math.sin(leverAngle)
                };
                const bHubL = move(brkHubLeft), bHubB = move(brkHubBot);
                const bJoinT = move(brkJoinTop), bJoinB = move(brkJoinBot);
                const topOut = move(bladeTopOuter), topIn = move(bladeTopInner);
                const midIn = move(bladeMidInner);
                const tip = move(doorTipOuter), tipIn = move(doorTipInner);
                const outCurve = ovalOuter.map(move), inCurve = ovalInner.map(move);
                const lTopOut = move(latchTopOuter), lTopIn = move(latchTopInner);
                const lHook = move(latchHookIn);

                let rightmostX = Math.max(tip.x, topOut.x, tipIn.x);
                let highestY = Math.max(tip.y, topOut.y);
                // Extremes use the SAME cubic elliptical curves rendered below.
                for (const curve of [outCurve, inCurve]) {
                    for (const j of [0, 3]) {
                        const a = curve[j], c1 = curve[j+1], c2 = curve[j+2], b = curve[j+3];
                        for (let i = 0; i <= 24; i++) {
                            const u = i / 24, v = 1 - u;
                            const bx = v*v*v*a.x + 3*v*v*u*c1.x + 3*v*u*u*c2.x + u*u*u*b.x;
                            const by = v*v*v*a.y + 3*v*v*u*c1.y + 3*v*u*u*c2.y + u*u*u*b.y;
                            rightmostX = Math.max(rightmostX, bx);
                            highestY = Math.max(highestY, by);
                        }
                    }
                }
                return { pin, leverMount, leverAngle, leverLength,
                    bHubL, bHubB, bJoinT, bJoinB,
                    topOut, topIn, midIn, tip, tipIn, outCurve, inCurve,
                    lTopOut, lTopIn, lHook, rightmostX, highestY };
            }

            function getDoorAtProgress(progress) {
                const u = Math.max(0, Math.min(1, Number(progress) || 0));
                return getDoorAtAngle(u * CONVENTIONAL_DOOR_OPEN_DEG);
            }

            function getDoorTipPosition(progress) {
                return getDoorAtProgress(progress).tip;
            }
            // Construct the physical guide FROM the joint's actual locus.
            // No separate fixed/circular track can desynchronise from it.
            const railPath = [];
            for (let i = 0; i <= 48; i++)
                railPath.push(getDoorAtProgress(i / 48).pin);
            const railStart = railPath[0], railEnd = railPath[railPath.length - 1];

            // True motion: both the swept fill and the dashed boundary sample
            // exactly these poses, never a fixed-radius or legacy-pivot sector.
            const openLimitDeg = CONVENTIONAL_DOOR_OPEN_DEG;
            const progress = Math.max(0, Math.min(1, state.thetaDeg / openLimitDeg));
            const doorClosed = getDoorAtProgress(0);
            const doorCurr = getDoorAtProgress(progress);
            const doorOpen = getDoorAtProgress(1);
            const trailSteps = Math.max(1, Math.ceil(progress / 0.02));
            const doorTipTrail = [];
            const doorPoseTrail = [];
            for (let i = 0; i <= trailSteps; i++) {
                const sampledProgress = progress * i / trailSteps;
                doorTipTrail.push(getDoorTipPosition(sampledProgress));
                doorPoseTrail.push(getDoorAtProgress(sampledProgress));
            }
            // Derive extrema and peak from the identical translated/rotated
            // profile, including the oval shell and the lower moving tip.
            let peakRightX = -Infinity, peakU = 0;
            for (let i = 0; i <= 100; i++) {
                const sampleU = i / 100;
                const candidate = getDoorAtProgress(sampleU).rightmostX;
                if (candidate > peakRightX) {
                    peakRightX = candidate;
                    peakU = sampleU;
                }
            }
            const thetaPeakDeg = peakU * openLimitDeg;
            const doorPeak = getDoorAtProgress(peakU);

            const doorBulgeBeyondTipMm = doorClosed.rightmostX - doorTipOuter.x;
            const corridorMarginPeakMm = CORRIDOR_LEFT_X - peakRightX; // > 0 = livre, 0 = colado na linha do corredor
            const corridorMarginCurrMm = CORRIDOR_LEFT_X - doorCurr.rightmostX;

            const widthClosedMm = doorClosed.rightmostX - wallX;
            const widthPeakMm = peakRightX - wallX;
            const widthOpenMm = doorOpen.rightmostX - wallX;
            const widthCurrMm = doorCurr.rightmostX - wallX;

            // Vão livre perpendicular à rampa quando totalmente aberta
            const openTipProjN = (doorOpen.tipIn.x - seatedBagBotRight.x) * nx + (doorOpen.tipIn.y - seatedBagBotRight.y) * ny;
            const maxMouthClearOpeningMm = openTipProjN;
            const doorClearanceOverBagMm = openTipProjN - SUITCASE.hMm;

            // Carenagem superior do bolsão 23
            const shroudStart = { x: lugTopLeft.x - 1.5 * tx, y: lugTopLeft.y - 1.5 * ty };
            const shroudStep = { x: shroudStart.x + 3.2 * nx, y: shroudStart.y + 3.2 * ny };
            const shroudEnd = { x: doorOpen.tip.x + 1.8, y: doorOpen.tip.y + 2.2 };
            const shroudCtrl = {
                x: (shroudStep.x + shroudEnd.x) * 0.5 - 2.0,
                y: Math.max(shroudStep.y, shroudEnd.y) + 4.8
            };

            const binTotalHeightMm = Math.max(hornPeak.y, rampTopEnd.y) - baseY;

            return {
                baseY, tiltDeg, wallFix, psuBotCorner,
                boxBotLeft, boxBotRight, boxTopRight, boxTopLeft,
                bagBotLeft, bagBotRight, bagTopLeft, bagTopRight,
                roundedBagPathD, roundedChamberPathD,
                seatedBagBotLeft, seatedBagBotRight, seatedBagTopRight, latchDropBelowBagMm,
                bagSeatedTopLeft, bagWallClearanceMm, bagBaseClearanceMm, doorBulgeBeyondTipMm, targetMaxDoorX,
                maxMouthClearOpeningMm, doorClearanceOverBagMm,
                corridorMarginPeakMm, corridorMarginCurrMm,
                hornPeak, notchValley, notchCtrl, rampTopEnd, fuseTop,
                bellyCtrl, doorLipBot, mouthStepIn, mouthCurveCtrl,
                pvt, railStart, railEnd, railPath, doorTipTrail, doorPoseTrail, getDoorTipPosition,
                lugTopLeft, lugBotRight,
                shroudStart, shroudStep, shroudEnd, shroudCtrl,
                thetaPeakDeg, openLimitDeg,
                doorClosed, doorPeak, doorOpen, doorCurr,
                peakRightX, widthClosedMm, widthPeakMm, widthOpenMm, widthCurrMm,
                binTotalHeightMm, tx, ty, nx, ny
            };
        }

        // Busca exata da Altura Y_esq que deixa o Bin o mais próximo possível da linha do corredor (X = -24,50 mm)
        
function alphaTransformPoint(fx, fy, thetaDeg) {
            // arquivo -> CAD (melhor encaixe na fuselagem) e depois rotação em torno do centro da fuselagem
            const A = ALPHA_FIXED;
            const x0 = A.scaleX * fx + A.tx;
            const y0 = A.scaleY * fy + A.ty;
            const cy = -CABIN_YC;
            const th = thetaDeg * Math.PI / 180.0;
            const c = Math.cos(th), s = Math.sin(th);
            return {
                x: (x0) * c - (y0 - cy) * s,
                ys: cy + (x0) * s + (y0 - cy) * c   // y no sistema do SVG (para baixo)
            };
        }

        // Parte de baixo do bin (face inferior = "chão do bin"): do fim do raio do canto até o pé, no contorno amostrado
        const ALPHA_UNDERSIDE = ALPHA_OUTLINE.filter(p => p[0] >= 1354 && p[0] <= 14462 && p[1] >= 18690);

        function alphaFloorHighPoint(thetaDeg) {
            // ponto mais alto do chão do bin (menor y no SVG)
            let best = null;
            for (const p of ALPHA_UNDERSIDE) {
                const q = alphaTransformPoint(p[0], p[1], thetaDeg);
                if (best === null || q.ys < best.ys) best = q;
            }
            return { x: best.x, y: -best.ys };
        }

        function alphaExtremeYAtTheta(thetaDeg, kind) {
            // 'floor' = chão do bin no ponto mais alto ; 'base' = ponto mais baixo ; 'top' = ponto mais alto (Y CAD, distância do chão da cabine)
            if (kind === 'floor') return alphaFloorHighPoint(thetaDeg).y;
            let maxYs = -Infinity, minYs = Infinity;
            for (const p of ALPHA_OUTLINE) {
                const q = alphaTransformPoint(p[0], p[1], thetaDeg);
                if (q.ys > maxYs) maxYs = q.ys;
                if (q.ys < minYs) minYs = q.ys;
            }
            return kind === 'top' ? -minYs : -maxYs;
        }

        function solveAlphaTheta(targetY, kind) {
            // Y diminui quando theta aumenta (horário no SVG); bisseção
            let lo = (kind === 'top') ? -9 : (kind === 'floor') ? -20 : -15, hi = 30;   // faixa onde Y é monotônico
            for (let i = 0; i < 50; i++) {
                const mid = (lo + hi) / 2;
                if (alphaExtremeYAtTheta(mid, kind) > targetY) lo = mid; else hi = mid;
            }
            return (lo + hi) / 2;
        }

        function computeRightAlphaLocked() {
            const A = ALPHA_FIXED;
            const thetaDeg = solveAlphaTheta(state.alphaTargetY, state.alphaMode);
            let minX = Infinity, maxX = -Infinity, minYs = Infinity, maxYs = -Infinity;
            for (const p of ALPHA_OUTLINE) {
                const q = alphaTransformPoint(p[0], p[1], thetaDeg);
                if (q.x < minX) minX = q.x;
                if (q.x > maxX) maxX = q.x;
                if (q.ys < minYs) minYs = q.ys;
                if (q.ys > maxYs) maxYs = q.ys;

                {x1: toX(xCorIn), y1: toY(yTopApex), x2: toX(xCorIn), y2: toY(yDimTopW + 3.0)},
                {x1: toX(xOutIn), y1: toY(alphaProf.yOuterTip), x2: toX(xOutIn), y2: toY(yDimTopW + 3.0)}
            );

            // 6. Cota do Corredor Central: 20" (de -10" a +10")
            const yDimCorridor = 14.8 * CM_PER_IN;
            if (!opts.finalDims) cadDim(5, ctx,
                toX(-xCorIn), toY(yDimCorridor),
                toX(xCorIn), toY(yDimCorridor),
                '20"', '#0f3c68', 14, {x: 0, y: 15},
                {x1: toX(-xCorIn), y1: toY(yDimCorridor + 3.2), x2: toX(-xCorIn), y2: toY(yDimCorridor - 3.2)},
                {x1: toX(xCorIn), y1: toY(yDimCorridor + 3.2), x2: toX(xCorIn), y2: toY(yDimCorridor - 3.2)}
            );

            // 7. Cota do Diâmetro Interno da Fuselagem: Ø 108" (2R)
            const yDimDiam = g.R + 11.5;
            const diamIn = (2 * g.R / CM_PER_IN);
            const diamTxt = 'Ø ' + diamIn.toFixed(2).replace(/\.?0+$/, '') + '"';
            if (!opts.finalDims) {
            ctx.save();
            ctx.setLineDash([4, 4]); ctx.globalAlpha = S(1) * dimFade * FD.dims;
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.55)';
            ctx.lineWidth = 1.0;
            [-g.R, g.R].forEach(xe => {
                ctx.beginPath();
                ctx.moveTo(toX(xe), toY(yDimDiam + 1.5));
                ctx.lineTo(toX(xe), toY(yMin));
                ctx.stroke();
            });
            ctx.restore();
            cadDim(6, ctx,
                toX(-g.R), toY(yDimDiam),
                toX(g.R), toY(yDimDiam),
                diamTxt, '#1e293b', 15, {x: 0, y: 0}
            );
            }

            if (opts.after) opts.after(ctx, { W, H, toX, toY, scale, g, yTopApex });
            ctx.restore();
        }

        // -------------------------------------------------------------------------
        // MÓDULO 3: MANIKIN ANTROPOMÉTRICO ARTICULADO & TEMPO POR MALA
        // -------------------------------------------------------------------------
        let manikinState = {
            mode: 'alpha2',
            phase: 0,
            animating: false,
            animDir: 1,
            calcT_Emb: 9.9,
            calcT_Alpha1: 7.9,
            calcT_Alpha2: 12.1,
            cardFrac: 0,
            cardsShown: false
        };

        // =========================================================================
        // CINEMÁTICA DE ESTIVA — baseada na sequência da Simulação CAD 3D (aba 6)
        //   1) Pega: mala segurada à frente do abdômen, joelhos levemente fletidos
        //   2) Elevação: mala sobe verticalmente, livre da quina do bin
        //   3) Alinhamento: atitude de entrada (em pé p/ Mala 1, "pé-na-frente" p/ Mala 2)
        //   4) Inserção: empurra pela abertura até a posição de projeto
        //   5) Soltura: mão larga a mala; braços retornam ao repouso
        // A fase (0–1) é a mesma do slider "Fase Cinemática".
        // =========================================================================
        const ergoClamp01 = (t) => Math.max(0, Math.min(1, t));
        const ergoSmooth = (t) => { t = ergoClamp01(t); return t * t * (3 - 2 * t); };

        // Interpolação Hermite cardinal (C1) entre keyframes [t, v0, v1, ...]
        function ergoSampleKeys(keys, t) {
            const n = keys.length, dim = keys[0].length - 1;
            if (t <= keys[0][0]) return keys[0].slice(1);
            if (t >= keys[n - 1][0]) return keys[n - 1].slice(1);
            let i = 0;
            while (i < n - 2 && t > keys[i + 1][0]) i++;
            const k0 = keys[i], k1 = keys[i + 1];
            const dt = k1[0] - k0[0];
            const s = (t - k0[0]) / dt;
            const s2 = s * s, s3 = s2 * s;
            const h00 = 2 * s3 - 3 * s2 + 1, h10 = s3 - 2 * s2 + s, h01 = -2 * s3 + 3 * s2, h11 = s3 - s2;
            const out = [];
            for (let d = 1; d <= dim; d++) {
                const tan = (a, b) => (b[d] - a[d]) / (b[0] - a[0]);
                const m0 = (i === 0) ? 0 : tan(keys[i - 1], keys[i + 1]);
                const m1 = (i + 1 === n - 1) ? 0 : tan(keys[i], keys[i + 2]);
                // limita a tangente para não haver overshoot entre keyframes consecutivos
                const sec = (k1[d] - k0[d]) / dt;
                const lim = (m, sc) => (sc === 0) ? 0 : (Math.sign(m) !== Math.sign(sc) ? 0 : Math.min(Math.abs(m), 3 * Math.abs(sc)) * Math.sign(m));
                out.push(h00 * k0[d] + h10 * dt * lim(m0, sec) + h01 * k1[d] + h11 * dt * lim(m1, sec));
            }
            return out;
        }


        // Perfil de apoio da mala: interpola a linha real do contorno CAD
        // do ALPHA na aba 5 (inclusive a transição curva e o fundo plano).
        function ergoBinFloorAt(prof, x) {
            if (prof.floorPts && prof.floorPts.length > 1) {
                const pts = prof.floorPts;
                if (x <= pts[0].x) return pts[0].y;
                if (x >= pts[pts.length - 1].x) return pts[pts.length - 1].y;
                for (let i = 1; i < pts.length; i++) {
                    if (x <= pts[i].x) {
                        const d = pts[i].x - pts[i-1].x;
                        const t = d > 1e-9 ? (x - pts[i-1].x) / d : 0;
                        return pts[i-1].y + t * (pts[i].y - pts[i-1].y);
                    }
                }
            }
            return x <= prof.xFlatEnd ? prof.y0 :
                prof.y0 + (x - prof.xFlatEnd) *
                (prof.yRampEnd - prof.y0) / (prof.xRampEnd - prof.xFlatEnd);
        }
        function ergoBagSupportY(prof, cx, w, h, angleDeg, gap = 0) {
            const r = -angleDeg*Math.PI/180, c = Math.cos(r), sn = Math.sin(r);
            const corners = [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]]
                .map(([x,y]) => [x*c-y*sn, x*sn+y*c]);
            const required = [];
            const check = (dx,dy) => {
                const x = cx+dx;
                if (x >= prof.x0-1e-7 && x <= prof.xRampEnd+1e-7)
                    required.push(ergoBinFloorAt(prof,x)-dy);
            };
            corners.forEach(([dx,dy]) => check(dx,dy));
            // Considera também intersecções com a borda e com a quebra
            // do piso, para a mala não atravessar a quina ao deslizar.
            corners.forEach(([ax,ay],i) => {
                const [bx,by] = corners[(i+1)%4];
                if (Math.abs(bx-ax)<1e-8) return;
                const floorEdges = prof.floorPts
                    ? prof.floorPts.map(p => p.x)
                    : [prof.x0, prof.xFlatEnd, prof.xRampEnd];
                for (const edge of floorEdges) {
                    const t=(edge-cx-ax)/(bx-ax);
                    if (t>=0 && t<=1) check(ax+t*(bx-ax),ay+t*(by-ay));
                }
            });
            return (required.length ? Math.max(...required) : prof.y0+h/2)+gap;
        }

        // Adaptador cinemático da aba 6 para o CAD da aba 5. Não desenha
        // uma segunda geometria: apenas calcula apoios e centros das malas.
        function ergoCADAlphaProfile(cad) {
            const pts = cad.floorPts;
            if (!pts || pts.length < 2) return null;
            let bend = Math.floor(pts.length / 2);
            for (let i = 1; i < pts.length; i++) {
                const dx = pts[i].x - pts[i-1].x;
                if (dx > 1e-8 && (pts[i-1].y - pts[i].y) / dx > 0.17) {
                    bend = i-1;
                    break;
                }
            }
            const x0 = pts[0].x, y0 = pts[0].y;
            const prof = {
                x0, y0, xFlatEnd: pts[bend].x, yFlatEnd: pts[bend].y,
                xRampEnd: pts[pts.length-1].x,
                yRampEnd: pts[pts.length-1].y,
                floorPts: pts, rad17: 17 * Math.PI / 180,
                m1W: 23.2, m1H: 34.8, m2W: 33.2, m2H: 22.8
            };
            prof.m1Cx = x0 + 1.8 + prof.m1W / 2;
            prof.m1Cy = ergoBagSupportY(prof, prof.m1Cx, prof.m1W, prof.m1H, 0, 1.2);
            // A mala deitada permanece após a quebra do piso, dentro da
            // cavidade CAD e com folga lateral da mala vertical.
            const halfW = (prof.m2W * Math.cos(prof.rad17) +
                           prof.m2H * Math.sin(prof.rad17)) / 2;
            prof.m2Cx = Math.min(prof.xFlatEnd + 23.0, prof.xRampEnd - halfW - 2.0);
            prof.m2Cy = ergoBagSupportY(prof, prof.m2Cx, prof.m2W, prof.m2H, 17, 1.2);
            return prof;
        }

        // =========================================================================
        // 1. POLÍGONO EXATO DA CAVIDADE DO OVERHEAD BIN ALPHA (CAD 1:10 em cm)
        // =========================================================================
        const ERGO_BIN_FLOOR = [
            [25.27, 150.10], [26.25, 150.19], [34.69, 149.71],
            [50.61, 148.32], [51.51, 148.19], [52.28, 148.08],
            [72.91, 141.91], [84.81, 138.45], [86.01, 138.10]
        ];
        const ERGO_BIN_CEIL = [
            [25.43, 182.95], [28.75, 187.91], [41.77, 186.16],
            [54.82, 184.71], [54.46, 173.97], [61.55, 171.82],
            [83.46, 165.30], [93.58, 161.43]
        ];

        function ergoInterpCurveY(pts, x) {
            if (x <= pts[0][0]) return pts[0][1];
            if (x >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
            for (let i = 1; i < pts.length; i++) {
                if (x <= pts[i][0]) {
                    const dx = pts[i][0] - pts[i - 1][0];
                    const t = dx > 1e-9 ? (x - pts[i - 1][0]) / dx : 0;
                    return pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1]);
                }
            }
            return pts[pts.length - 1][1];
        }

        function ergoBagCorners(cx, cy, w, h, angleDeg) {
            const r = -angleDeg * Math.PI / 180;
            const c = Math.cos(r), s = Math.sin(r);
            return [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]
                .map(([dx, dy]) => [cx + dx * c - dy * s, cy + dx * s + dy * c]);
        }

        // Ponto na superfície do retângulo da mala, partindo do centro na direção (dirX, dirY)
        function ergoBagSurfacePoint(cx, cy, w, h, angleDeg, dirX, dirY) {
            const r = -angleDeg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
            // direção no referencial local da mala (rotação inversa)
            const lx = dirX * c + dirY * s;
            const ly = -dirX * s + dirY * c;
            const tx = Math.abs(lx) > 1e-9 ? (w / 2) / Math.abs(lx) : Infinity;
            const ty = Math.abs(ly) > 1e-9 ? (h / 2) / Math.abs(ly) : Infinity;
            const t = Math.min(tx, ty);
            const px = lx * t, py = ly * t;
            // volta ao referencial global
            return [cx + px * c - py * s, cy + px * s + py * c];
        }

        // Resolve a folga vertical mínima da mala em relação ao piso e ao teto do bin
        function ergoCavityClearance(cx, cy, w, h, angleDeg) {
            const corners = ergoBagCorners(cx, cy, w, h, angleDeg);
            let minFloor = Infinity, minCeil = Infinity;

            for (const [x, y] of corners) {
                if (x >= 25.0) {
                    minFloor = Math.min(minFloor, y - ergoInterpCurveY(ERGO_BIN_FLOOR, x));
                    minCeil = Math.min(minCeil, ergoInterpCurveY(ERGO_BIN_CEIL, x) - y);
                }
            }
            for (let i = 0; i < 4; i++) {
                const [ax, ay] = corners[i];
                const [bx, by] = corners[(i + 1) % 4];
                if (Math.abs(bx - ax) < 1e-8) continue;
                for (const [fx, fy] of ERGO_BIN_FLOOR) {
                    if ((ax - fx) * (bx - fx) <= 0) {
                        const t = (fx - ax) / (bx - ax);
                        minFloor = Math.min(minFloor, (ay + t * (by - ay)) - fy);
                    }
                }
                for (const [cxP, cyP] of ERGO_BIN_CEIL) {
                    if ((ax - cxP) * (bx - cxP) <= 0) {
                        const t = (cxP - ax) / (bx - ax);
                        minCeil = Math.min(minCeil, cyP - (ay + t * (by - ay)));
                    }
                }
            }
            return { minFloor, minCeil };
        }

        // Projeta a mala estritamente dentro do corredor de entrada do bin (sem clipping)
        function ergoClampBagToCavity(cx, cy, w, h, angleDeg, floorMargin = 0.30, ceilMargin = 0.45) {
            let y = cy;
            const c1 = ergoCavityClearance(cx, y, w, h, angleDeg);
            if (c1.minFloor < floorMargin) y += (floorMargin - c1.minFloor);
            const c2 = ergoCavityClearance(cx, y, w, h, angleDeg);
            if (c2.minCeil < ceilMargin) y -= (ceilMargin - c2.minCeil);
            return y;
        }

        function ergoEvalBezier(p0, p1, p2, p3, t) {
            const u = 1 - t;
            return [
                u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
                u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]
            ];
        }

        // =========================================================================
        // 2. PLANO DE TRAJETÓRIA CURVA (BEZIER) E ESTÁGIOS DE ESTIVA
        // =========================================================================
        function ergoStowPlan(mode, prof, stature) {
            // Mala 2: entra primeiro e repousa deitada sobre a rampa interna (~16.3°)
            if (mode === 'alpha2') {
                const w = prof.m2W, h = prof.m2H; // 33.2 x 22.8 cm
                const restAng = 16.3;
                const restCx = 70.2;
                const restCy = ergoClampBagToCavity(restCx, 155.0, w, h, restAng, 0.25, 0.50);
                prof.m2Cx = restCx;
                prof.m2Cy = restCy;

                return {
                    mode, w, h,
                    tSupport: 0.62, tPush: 0.84, tPlace: 0.86,
                    footX: -14.0,
                    restCx, restCy, restAng,
                    stages: [
                        [0.00, 'Prepare & Grip (Hip Level)'],
                        [0.14, 'Chest Pull & Lift'],
                        [0.36, 'Align & Rotate at Mouth'],
                        [0.62, 'Slide on 16.3° Shelf'],
                        [0.86, 'Release & Return']
                    ]
                };
            }

            // Mala 1: entra em segundo lugar e repousa em pé na prateleira frontal (~4.5°)
            if (mode === 'alpha1') {
                const w = prof.m1W, h = prof.m1H; // 23.2 x 34.8 cm
                const restAng = 4.5;
                const restCx = 38.0;
                const restCy = ergoClampBagToCavity(restCx, 167.2, w, h, restAng, 0.25, 0.50);
                prof.m1Cx = restCx;
                prof.m1Cy = restCy;

                return {
                    mode, w, h,
                    tSupport: 0.64, tPush: 0.82, tPlace: 0.84,
                    footX: -14.0,
                    restCx, restCy, restAng,
                    stages: [
                        [0.00, 'Prepare & Grip (Hip Level)'],
                        [0.14, 'Chest Pull & Lift'],
                        [0.42, 'Enter Front Opening'],
                        [0.64, 'Slide to Front Stop'],
                        [0.84, 'Release & Return']
                    ]
                };
            }
            return null;
        }

        function ergoSampleBagTrajectory(plan, phase) {
            const p = ergoClamp01(phase);
            const s = ergoSmooth;

            if (plan.mode === 'alpha2') {
                const { w, h, restCx, restCy, restAng } = plan;
                if (p <= 0.14) {
                    // Fase 1: Pega na altura do quadril
                    const t = s(p / 0.14);
                    return { x: 9.5 - 0.8 * t, y: 95.0 + 2.0 * t, a: -90.0, alpha: 1.0 };
                } else if (p <= 0.36) {
                    // Fase 2: Puxa para perto do peito/ombro antes de elevar acima da cabeça
                    const t = s((p - 0.14) / 0.22);
                    const [bx, by] = ergoEvalBezier([8.7, 97.0], [5.8, 121.0], [7.8, 146.0], [13.2, 163.5], t);
                    const ang = -90.0 + 22.0 * s((t - 0.45) / 0.55);
                    return { x: bx, y: by, a: ang, alpha: 1.0 };
                } else if (p <= 0.62) {
                    // Fase 3A: Rotação suave pelo punho e entrada pela boca frontal sem tocar no teto/lábio
                    const t = s((p - 0.36) / 0.26);
                    const [bx, byRaw] = ergoEvalBezier([13.2, 163.5], [18.5, 167.2], [27.5, 166.2], [38.5, 164.3], t);
                    const ang = -68.0 + (restAng - (-68.0)) * s(t);
                    const by = ergoClampBagToCavity(bx, byRaw, w, h, ang, 0.35, 0.55);
                    return { x: bx, y: by, a: ang, alpha: 1.0 };
                } else if (p <= 0.86) {
                    // Fase 3B: Deslizamento apoiado sobre a rampa interna de 16.3° até encostar no fundo
                    const t = s((p - 0.62) / 0.24);
                    const bx = 38.5 + (restCx - 38.5) * t;
                    const byLinear = 164.3 + (restCy - 164.3) * t;
                    const by = ergoClampBagToCavity(bx, byLinear, w, h, restAng, 0.25, 0.50);
                    return { x: bx, y: by, a: restAng, alpha: 1.0 };
                }
                return { x: restCx, y: restCy, a: restAng, alpha: 1.0 };
            }

            // Mala 1 (em pé na prateleira frontal, entrada após a Mala 2 estar guardada)
            const { w, h, restCx, restCy, restAng } = plan;
            const fadeAlpha = s(p / 0.10);
            if (p <= 0.14) {
                const t = s(p / 0.14);
                return { x: 9.8 - 0.8 * t, y: 97.5 + 1.5 * t, a: 0.0, alpha: fadeAlpha };
            } else if (p <= 0.42) {
                const t = s((p - 0.14) / 0.28);
                const [bx, by] = ergoEvalBezier([9.0, 99.0], [6.2, 122.0], [8.5, 148.0], [13.5, 165.8], t);
                const ang = restAng * s((t - 0.40) / 0.60);
                return { x: bx, y: by, a: ang, alpha: 1.0 };
            } else if (p <= 0.64) {
                const t = s((p - 0.42) / 0.22);
                const [bx, byRaw] = ergoEvalBezier([13.5, 165.8], [18.5, 166.8], [24.0, 167.2], [29.8, 167.4], t);
                const by = ergoClampBagToCavity(bx, byRaw, w, h, restAng, 0.30, 0.50);
                return { x: bx, y: by, a: restAng, alpha: 1.0 };
            } else if (p <= 0.84) {
                const t = s((p - 0.64) / 0.20);
                const bx = 29.8 + (restCx - 29.8) * t;
                const byLinear = 167.4 + (restCy - 167.4) * t;
                const by = ergoClampBagToCavity(bx, byLinear, w, h, restAng, 0.25, 0.50);
                return { x: bx, y: by, a: restAng, alpha: 1.0 };
            }
            return { x: restCx, y: restCy, a: restAng, alpha: 1.0 };
        }

        // =========================================================================
        // 3. CINEMÁTICA INVERSA ARTICULADA (JOELHOS, TORNOZELOS, TRONCO, OMBRO, COTOVELO, PUNHO)
        // =========================================================================
        function ergoSolvePosture(stature, plan, phase) {
            const H = stature;
            const clamp = ergoClamp01, smooth = ergoSmooth;
            const bagState = ergoSampleBagTrajectory(plan, phase);
            let bx = bagState.x, by = bagState.y, ba = bagState.a;

            // Proporções antropométricas do percentil 5% feminino (H = 151.89 cm)
            const Lthigh = 0.245 * H;
            const Lshank = 0.285 * H - 4.0;
            const Ltorso = 0.288 * H;
            const L1 = 0.186 * H;          // Úmero (ombro -> cotovelo)
            const L2 = 0.146 * H + 5.0;    // Antebraço + punho (cotovelo -> pega)
            const armMax = L1 + L2 - 0.30;

            // Pesos suaves por fase biomecânica
            const wPrep   = 1.0 - smooth((phase - 0.10) / 0.12);
            const wChest  = smooth((phase - 0.12) / 0.14) * (1.0 - smooth((phase - 0.36) / 0.14));
            const wReach  = smooth((phase - 0.34) / 0.18) * (1.0 - smooth((phase - plan.tPlace) / 0.10));
            const wInsert = smooth((phase - plan.tSupport) / Math.max(0.06, plan.tPush - plan.tSupport))
                          * (1.0 - smooth((phase - plan.tPlace) / 0.10));

            // 1) Joelhos e tornozelos:
            //    - Fase 1: leve flexão de joelhos para absorver a carga no quadril
            //    - Fase 3: extensão completa dos joelhos + elevação nos calcanhares para alcance máximo
            const kneeDip = 3.8 * wPrep + 1.2 * wChest;
            const heel = 3.8 * wReach;
            const phi = Math.asin(Math.min(0.9, heel / 10.5));
            const toeX = plan.footX + 10.5, toeY = 2.0;
            const ankleX = toeX - 10.5 * Math.cos(phi) + 2.0 * Math.sin(phi);
            const ankleY = toeY + 10.5 * Math.sin(phi) + 2.0 * Math.cos(phi);

            // 2) Tronco:
            //    - Fase 1: inclinado ~5° para trás (-0.087 rad) contrabalançando o peso no quadril
            //    - Fase 3: inclinado ~9° para frente (+0.157 rad) durante a extensão superior e inserção no bin
            const torsoTilt = (-0.087 * wPrep) + (0.02 * wChest) + (0.140 * wReach) + (0.035 * wInsert);

            const legLen = Math.min(Lthigh + Lshank - 0.25, Lthigh + Lshank - 0.4 - kneeDip);
            const hipDX = -1.2 * wPrep + 1.8 * wReach + 3.2 * wInsert;
            const hipX = ankleX + hipDX;
            const hipY = ankleY + Math.sqrt(Math.max(1.0, legLen * legLen - hipDX * hipDX));
            const shX = hipX + Ltorso * Math.sin(torsoTilt);
            const shY = hipY + Ltorso * Math.cos(torsoTilt);

            // Passada posterior de estabilização durante o empurrão alto
            const step = smooth((phase - 0.44) / 0.20) * (1.0 - smooth((phase - plan.tPlace) / 0.10));
            const rAx = ankleX - 10.5 * step, rAy = ankleY;
            const kneeIK = (ax, ay) => {
                const dx = hipX - ax, dy = hipY - ay;
                const dist = Math.max(0.001, Math.hypot(dx, dy));
                const d = Math.min(dist, Lthigh + Lshank - 0.01);
                const c = Math.max(-1, Math.min(1,
                    (Lshank * Lshank + d * d - Lthigh * Lthigh) / (2 * Lshank * d)));
                const a = Math.acos(c), ux = dx / dist, uy = dy / dist;
                return [
                    ax + Lshank * (ux * Math.cos(a) + uy * Math.sin(a)),
                    ay + Lshank * (-ux * Math.sin(a) + uy * Math.cos(a))
                ];
            };
            const knee = kneeIK(ankleX, ankleY), kneeR = kneeIK(rAx, rAy);

            // Centralização do corpo no corredor de 20" (sem alterar as coordenadas do bin)
            const headLen = 0.118 * H, neckTilt = 0.25 * torsoTilt;
            const headPreviewX = shX + headLen * Math.sin(neckTilt) + 0.2;
            const frontFoot = (267.3 - 215.29) * H / 545.0;
            const bodyLeft = Math.min(ankleX - 5, rAx - 5, knee[0] - 5, kneeR[0] - 5, hipX - 6, shX - 7, headPreviewX - 0.068 * H);
            const bodyRight = Math.max(ankleX + frontFoot, rAx + frontFoot, knee[0] + 5, kneeR[0] + 5, hipX + 6, shX + 7, headPreviewX + 0.068 * H);
            const shiftX = -(bodyLeft + bodyRight) * 0.5;
            const shoulderX = shX + shiftX, shoulderY = shY;
            const headX = headPreviewX + shiftX;
            const headY = shY + headLen * Math.cos(neckTilt);

            // 3) Acoplamento Mão-Objeto (ponto de pega exato na mala):
            const handSlide = smooth((phase - plan.tSupport) / Math.max(0.06, plan.tPush - plan.tSupport));
            const rot = -ba * Math.PI / 180;
            // Âncoras de pega FIXAS no referencial da mala (alça): a mão fica travada no mesmo ponto durante todo o trajeto
            const gc = Math.cos(rot), gs = Math.sin(rot);
            let GA;
            if (plan.mode === 'alpha1') GA = [-0.38 * plan.w, -0.26 * plan.h];
            else {
                const dm = Math.hypot(0.95, 0.31), ux = -0.95 / dm, uy = -0.31 / dm;
                const sp = ergoBagSurfacePoint(0, 0, plan.w, plan.h, 0, ux, uy);
                GA = [sp[0] - ux * 0.40, sp[1] - uy * 0.40];
            }
            const gx = bx + GA[0] * gc - GA[1] * gs, gy = by + GA[0] * gs + GA[1] * gc;

            // Soltura suave (ease-in-out) apenas após a mala repousar dentro do bin
            const returnT = clamp((phase - plan.tPlace) / (1.0 - plan.tPlace));
            const release = smooth(returnT);
            const rest = [shoulderX + 1.6, shoulderY - 0.90 * (L1 + L2)];
            const target = [
                gx + (rest[0] - gx) * release,
                gy + (rest[1] - gy) * release
            ];

            // 4) IK de 2 elos (Ombro -> Cotovelo -> Punho) com flexão natural na fase do peito
            const armIK = (sx, sy, tx, ty) => {
                const dx = tx - sx, dy = ty - sy;
                const dist = Math.max(0.001, Math.hypot(dx, dy));
                const reach = Math.min(armMax, Math.max(Math.abs(L1 - L2) + 0.2, dist));
                const base = Math.atan2(dy, dx);
                const c = Math.max(-1, Math.min(1,
                    (L1 * L1 + reach * reach - L2 * L2) / (2 * L1 * reach)));
                const a = base - Math.acos(c);
                const ex = sx + L1 * Math.cos(a), ey = sy + L1 * Math.sin(a);
                const k = Math.min(1, armMax / dist);
                return {
                    ex, ey,
                    hx: sx + dx * k,
                    hy: sy + dy * k,
                    reached: dist <= armMax + 0.001
                };
            };
            const arm = armIK(shoulderX, shoulderY, target[0], target[1]);
            const armFar = armIK(shoulderX - 1.0, shoulderY - 0.6, target[0] - 1.6, target[1] + 0.6);

            // Acompanhamento visual da cabeça em direção à mala
            const look = Math.atan2(by - headY, bx - headX);
            const headPitch = 0.04 + 0.28 * smooth((phase - 0.22) / 0.24) * (1 - release);
            const pitch = Math.min(0.38, headPitch + Math.max(0, Math.min(0.15, look * 0.15)));

            // Elevação real do ombro: ângulo do úmero (ombro→cotovelo) medido a partir da vertical para baixo (0° = braço pendente)
            const shAngle = Math.atan2(Math.abs(arm.ex - shoulderX), -(arm.ey - shoulderY)) * 180 / Math.PI;
            const l5 = [hipX + shiftX + 0.10 * (shoulderX - (hipX + shiftX)), hipY + 0.10 * (shoulderY - hipY)];   // L5/S1 ≈ 10% do tronco acima do quadril
            return {
                l5, shAngle,
                bag: { x: bx, y: by, a: ba, grip: handSlide, release, alpha: bagState.alpha },
                footX: plan.footX + shiftX, toeX: toeX + shiftX, toeY,
                phi, heel,
                ankle: [ankleX + shiftX, ankleY],
                knee: [knee[0] + shiftX, knee[1]],
                hip: [hipX + shiftX, hipY],
                ankleR: [rAx + shiftX, rAy],
                kneeR: [kneeR[0] + shiftX, kneeR[1]],
                sa: step,
                shoulder: [shoulderX, shoulderY],
                head: [headX, headY],
                headPitch: pitch,
                neckTilt,
                torsoTilt,
                beta: torsoTilt,
                arm,
                armFar,
                handTarget: target,
                reachable: arm.reached
            };
        }

        function ergoStageName(plan, phase) {
            let name = plan.stages[0][1];
            for (const [t, n] of plan.stages) if (phase >= t) name = n;
            return name;
        }

        function setAnimLabel() {
            const el = document.getElementById('lbl-anim-btn');
            if (!el) return;
            el.textContent = manikinState.animating ? 'Pause Kinematics'
                : (manikinState.phase >= 0.999 ? 'Restart Simulation'
                : (manikinState.phase > 0 ? 'Resume Simulation' : 'Start Simulation'));
        }


        // Exporta os 3 momentos (Step 1 / 2 / 3) lado a lado em PNG com fundo transparente, como na figura de referência.
        // Se noDownload = true, apenas devolve o canvas (usado para gerar o arquivo fora da página).
        function exportManikinSteps(noDownload) {
            const L = manikinState.last;
            if (!L) return null;
            const t = L.times[0], fracBack = t.tA2 / (t.tA2 + t.tA1);
            const moments = [0.07, 0.48, 0.78];   // fase local da mala 2: elevação (1), apoio na borda (2), deslize (3)
            const Wl = 1120, Hl = 740, S = 2;
            const prev = window.__mkExport; window.__mkExport = true;
            const outs = [];
            try {
                moments.forEach(lp => {
                    const c = document.createElement('canvas'); c.width = Wl * S; c.height = Hl * S;
                    const g = c.getContext('2d'); g.scale(S, S);
                    drawManikinPanel(g, Wl, Hl, ERGO_PERCENTILES[0].h, L.mass, L.angleDeg, L.Fg, L.Fn, L.Ft, lp * fracBack, t.tA2, t.tA1, '');
                    // recorta as bordas vazias, mantendo o fundo transparente
                    const w = c.width, h = c.height, d = g.getImageData(0, 0, w, h).data;
                    let x0 = w, x1 = 0, y0 = h, y1 = 0;
                    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
                    const m = 16; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
                    const crop = document.createElement('canvas'); crop.width = x1 - x0 + 1; crop.height = y1 - y0 + 1;
                    crop.getContext('2d').drawImage(c, x0, y0, crop.width, crop.height, 0, 0, crop.width, crop.height);
                    outs.push(crop);
                });
            } finally { window.__mkExport = prev; }
            if (noDownload) return outs;
            outs.forEach((cv, i) => setTimeout(() => cv.toBlob(b => {   // 3 arquivos PNG transparentes: step 1, 2 e 3
                const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `overhead_bin_alpha_step${i + 1}.png`;
                document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            }, 'image/png'), i * 400));
            return outs;
        }

        function toggleManikinAnimation() {
            if (manikinState.animating) { manikinState.animating = false; setAnimLabel(); return; }
            cancelResultsSequence();
            if (manikinState.phase >= 0.999) { manikinState.phase = 0; hideCards(); }
            manikinState.animating = true;
            setAnimLabel();
        }

        function cancelResultsSequence() {
            manikinState.seq = (manikinState.seq || 0) + 1;
            manikinState.onCardsClosed = null;
            if (manikinState.cleanup) { manikinState.cleanup(); manikinState.cleanup = null; }
            if (!manikinState.swapped) { const e = document.getElementById('module-ergo'); if (e) { e.style.transition = ''; e.style.opacity = ''; } }
            (manikinState.seqTimers || []).forEach(clearTimeout);
            manikinState.seqTimers = [];
        }

        addEventListener('keydown', e => { if (e.key === 'Escape' && window.__stopTourRec) window.__stopTourRec(); });

        function showManikin() {
            cancelResultsSequence();
            // A abertura da cena no tour também usa o frame inicial real.
            manikinState.phase = 0;
            manikinState.animating = false;
            setAnimLabel();
            const ergo = document.getElementById('module-ergo');
            manikinState.swapped = false;
            ergo.style.display = ''; ergo.style.transition = ''; ergo.style.opacity = '';
            requestAnimationFrame(() => updateErgonomics());
        }

        function runResultsSequence() {
            // A postura final fica estável com o cronômetro congelado; o roteiro encerra após breve pausa.
            cancelResultsSequence();
            const id = manikinState.seq;
            const HOLD = 2500;                                // 2–3 s de cena final estabilizada
            const t = setTimeout(() => { if (manikinState.seq === id) window.ergoDone = true; }, HOLD);
            manikinState.seqTimers.push(t);
        }

        function startManikinLoop() {
            // Ciclo contínuo (pega → eleva → insere → solta → próximo passageiro), em tempo real:
            // a duração de cada ciclo é o "Tempo por Mala" calculado para o modo selecionado.
            let last = performance.now();
            setInterval(() => {
                const now = performance.now();
                const dt = Math.min(0.1, (now - last) / 1000);
                last = now;
                if (currentTab !== 'sim' || !manikinState.animating) return;
                const tCycle = Math.max(6, manikinState.cycleT || 20) * 0.55;   // percentil mais lento define o ciclo
                manikinState.phase = Math.min(1.0, manikinState.phase + (dt * 1.45) / tCycle); // playback 1.45x; timer usa a mesma phase
                const finished = manikinState.phase >= 1.0;
                // Keep animating across cycle boundaries; phase resets below.
                updateErgonomics();
                if (finished) {
                    if (aba6TourMode && window.parent !== window) {
                        // The full presentation holds on the finished pose, then continues to Closing.
                        manikinState.animating = false;
                        setAnimLabel();
                        window.parent.postMessage({type:'apha-aba6-cycle-complete'}, '*');
                    } else {
                        // Tab 6 itself plays continuously, without requiring a click.
                        manikinState.phase = 0;
                        hideCards();
                        updateErgonomics();
                    }
                }
            }, 40);
        }

        // O rótulo visível "95th Percentile" permanece conforme solicitado anteriormente.
        const ERGO_PERCENTILES = [
            { h: 59.8 * 2.54, title: 'Female', sub: 'P5' }
        ];

        function ergoTimes(stature, mass, angleDeg) {
            const statureFactor = Math.max(0, (170.0 - stature) * 0.065);
            const massFactor = Math.max(0, (mass - 10.0) * 0.32);
            const rampFactor = (angleDeg / 17.0) * 1.1;
            return {
                tEmb: 8.4 + massFactor + statureFactor * 0.8 + 1.5,
                tA1: 6.8 + massFactor * 0.85 + statureFactor * 0.4 + 1.1,
                tA2: 9.8 + massFactor * 1.15 + statureFactor * 1.3 + rampFactor + 1.2
            };
        }

        function writeCards(frac) {
            const v = manikinState.cardVals; if (!v) return;
            for (const id in v) {
                const el = document.getElementById(id);
                if (el) el.textContent = v[id][2] === '%' ? `−${(v[id][0] * frac).toFixed(v[id][1])}%` : `${(v[id][0] * frac).toFixed(v[id][1])} s`;
            }
        }

        function revealCards() {
            if (manikinState.cardsShown) return;
            manikinState.cardsShown = true;
            const box = document.getElementById('ergo-overlay');
            if (box) { box.classList.add('cards-on'); box.setAttribute('aria-hidden', 'false'); }
            const t0 = performance.now(), dur = 1300;
            const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
            const tick = (now) => {
                if (!manikinState.cardsShown) return;
                const k = reduce ? 1 : Math.min(1, Math.max(0, (now - t0 - 250) / dur));
                manikinState.cardFrac = 1 - Math.pow(1 - k, 3);   // ease-out
                writeCards(manikinState.cardFrac);
                if (k < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        function hideCards() {
            if (!manikinState.cardsShown) return;
            manikinState.cardsShown = false;
            manikinState.cardFrac = 0;
            const box = document.getElementById('ergo-overlay');
            if (box) { box.classList.remove('cards-on'); box.setAttribute('aria-hidden', 'true'); }
            writeCards(0);
        }

        function updateErgonomics() {
            const mass = 10.0;
            const angleDeg = 17.0;
            const phase = manikinState.phase;

            

            const Fg = mass * 9.81;
            const rad = (angleDeg * Math.PI) / 180.0;
            const Fn = Fg * Math.cos(rad);
            const Ft = Fg * Math.sin(rad);

            const times = ERGO_PERCENTILES.map(p => ergoTimes(p.h, mass, angleDeg));

            // Cards e exportação para o Embarque usam o P5 feminino (59,8 pol) da cena.
            const ref = times[0];
            const tEmb = ref.tEmb, tAlpha1 = ref.tA1, tAlpha2 = ref.tA2;
            const tAlphaAvg = (2 * tAlpha1 + 2 * tAlpha2) / 4.0;
            manikinState.calcT_Emb = tEmb;
            manikinState.calcT_Alpha1 = tAlpha1;
            manikinState.calcT_Alpha2 = tAlpha2;
            manikinState.cycleT = Math.max(...times.map(t => t.tA1 + t.tA2));

            manikinState.cardVals = {
                'card-t-alpha-mod': [tAlphaAvg * 4, 1], 'card-t-conv-mod': [tEmb * 4, 1]
            };
            writeCards(manikinState.cardFrac);

            // Resultados só aparecem quando a simulação termina; ao reiniciar, somem de novo
            if (phase < 0.999) hideCards();

            manikinState.last = { mass, angleDeg, Fg, Fn, Ft, times };
            drawManikinViewport(mass, angleDeg, Fg, Fn, Ft, phase, times);
        }

        // A Aba 6 mantém o manequim vetorial original (vermelho.pdf)

        function drawManikinViewport(mass, angleDeg, Fg, Fn, Ft, phase, times) {

                canvas.height = ph;

                    ctx.beginPath();ctx.roundRect(-31*k,-43*k,62*k,86*k,6*k);ctx.fill();ctx.stroke();
                    ctx.beginPath();ctx.roundRect(-12*k,-55*k,24*k,12*k,4*k);ctx.stroke();

            });
            // divisórias entre painéis
