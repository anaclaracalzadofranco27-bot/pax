name: Build and verify standalone HTML

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch at a time; never cancel a build midway through committing.
concurrency:
  group: single-file-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-main:
    name: Rebuild and commit HTML on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble standalone HTML
        run: python3 tools/build.py
      - name: Verify assembled file is in sync
        run: python3 tools/build.py --check
      - name: Check assembled theme, config and CAD engine JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("FINALPROJECT_APHA.html").read_text(encoding="utf-8")
          inline = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          config = next((code for code in inline if "const APHA_CABIN_PALETTE" in code), None)
          if config is None:
              raise SystemExit("Missing assembled Canvas/Tailwind configuration script")
          Path("/tmp/apha-assembled-config.js").write_text(config, encoding="utf-8")
          engine = next((code for code in inline if
                         "function drawCADCanvas(" in code and
                         "window.drawSeatedScene = drawSeatedScene;" in code), None)
          if engine is None:
              raise SystemExit("Missing assembled CAD and seated-cabin engine")
          Path("/tmp/apha-assembled-engine.js").write_text(engine, encoding="utf-8")
          PY
          node --check /tmp/apha-assembled-config.js
          node --check /tmp/apha-assembled-engine.js
      - name: Check assembled aircraft JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build import expand
          Path("/tmp/apha-assembled-aircraft.js").write_bytes(
              expand("source/html/ABA1/js/aircraft.js"))
          PY
          node --check /tmp/apha-assembled-aircraft.js
      - name: Check assembled passenger JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build import expand
          Path("/tmp/apha-assembled-passengers.js").write_bytes(
              expand("source/html/ABA1/js/passengers.js"))
          PY
          node --check /tmp/apha-assembled-passengers.js
      - name: Check assembled CAD 3D JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build import expand
          Path("/tmp/apha-assembled-cad3d.js").write_bytes(
              expand("source/html/ABA2/cad3d.js"))
          PY
          node --check /tmp/apha-assembled-cad3d.js
      - name: Simulate CAD 3D export failures and state restoration
        run: node tools/test_cad3d_exports.js
      - name: Test Aba 5 door ownership, replay and 4K export recovery
        run: node tools/test_aba5_controls.js
      - name: Compare shared cabin coordinates across tabs 5, 6 and 8
        run: node tools/test_shared_cabin_geometry.js
      - name: Audit Aba 6 suitcase clearance over 2002 positions
        run: node tools/test_aba6_clearance.js
      - name: Test Aba 6 PNG exporters and Canvas fallback failure recovery
        run: node tools/test_aba6_resilience.js
      - name: Verify Aba 7 SVG vectors, replay, fonts and Takes 04/05
        run: node tools/test_aba7_closing.js
      - name: Verify eight tabs, CSS, passengers, assets, transitions and Full HD takes
        run: python3 tools/verify_preservation.py
      - name: Commit the generated HTML only if it changed
        shell: bash
        run: |
          if git diff --quiet -- FINALPROJECT_APHA.html; then
            echo "FINALPROJECT_APHA.html is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- FINALPROJECT_APHA.html
          git commit -m "build: sync FINALPROJECT_APHA.html from src"
          git push origin HEAD:main

  verify-other-branches:
    name: Verify pull requests and other branches
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble standalone HTML
        run: python3 tools/build.py
      - name: Verify assembled file
        run: python3 tools/build.py --check
      - name: Check assembled theme, config and CAD engine JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("FINALPROJECT_APHA.html").read_text(encoding="utf-8")
          inline = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          config = next((code for code in inline if "const APHA_CABIN_PALETTE" in code), None)
          if config is None:
              raise SystemExit("Missing assembled Canvas/Tailwind configuration script")
          Path("/tmp/apha-assembled-config.js").write_text(config, encoding="utf-8")
          engine = next((code for code in inline if
                         "function drawCADCanvas(" in code and
                         "window.drawSeatedScene = drawSeatedScene;" in code), None)
          if engine is None:
              raise SystemExit("Missing assembled CAD and seated-cabin engine")
          Path("/tmp/apha-assembled-engine.js").write_text(engine, encoding="utf-8")
          PY
          node --check /tmp/apha-assembled-config.js
          node --check /tmp/apha-assembled-engine.js
      - name: Check assembled aircraft JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build import expand
          Path("/tmp/apha-assembled-aircraft.js").write_bytes(
              expand("source/html/ABA1/js/aircraft.js"))
          PY
          node --check /tmp/apha-assembled-aircraft.js
      - name: Check assembled passenger JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build import expand
          Path("/tmp/apha-assembled-passengers.js").write_bytes(
              expand("source/html/ABA1/js/passengers.js"))
          PY
          node --check /tmp/apha-assembled-passengers.js
      - name: Check assembled CAD 3D JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build import expand
          Path("/tmp/apha-assembled-cad3d.js").write_bytes(
              expand("source/html/ABA2/cad3d.js"))
          PY
          node --check /tmp/apha-assembled-cad3d.js
      - name: Simulate CAD 3D export failures and state restoration
        run: node tools/test_cad3d_exports.js
      - name: Test Aba 5 door ownership, replay and 4K export recovery
        run: node tools/test_aba5_controls.js
      - name: Compare shared cabin coordinates across tabs 5, 6 and 8
        run: node tools/test_shared_cabin_geometry.js
      - name: Audit Aba 6 suitcase clearance over 2002 positions
        run: node tools/test_aba6_clearance.js
      - name: Test Aba 6 PNG exporters and Canvas fallback failure recovery
        run: node tools/test_aba6_resilience.js
      - name: Verify Aba 7 SVG vectors, replay, fonts and Takes 04/05
        run: node tools/test_aba7_closing.js
      - name: Verify eight tabs, CSS, passengers, assets, transitions and Full HD takes
        run: python3 tools/verify_preservation.py
