name: Browser presentation smoke tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium-smoke:
    name: Check eight tabs and five takes in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and check HTML
        run: |
          python3 tools/build.py
          python3 tools/build.py --check
          python3 tools/verify_preservation.py
      - name: Verify controller JavaScript syntax
        run: |
          node --check source/js/core/navigation.js
          node --check source/js/core/download.js
          node --check source/html/ABA8/director-and-recording.js
      - name: Build baseline from PR base for Aba 1 pixel comparison
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PAX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/pax-aba1-baseline
          git archive "$PAX_BASE_SHA" | tar -x -C /tmp/pax-aba1-baseline
          python3 /tmp/pax-aba1-baseline/tools/build.py
          cp /tmp/pax-aba1-baseline/FINALPROJECT_APHA.html PAX_ABA1_BASELINE.html
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser smoke tests and baseline model comparison
        env:
          PAX_ABA1_BASELINE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npx playwright test
      - name: Attach browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pax-browser-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
